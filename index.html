<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Robot Arena v0.1</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0d10;
    touch-action: none;
    overscroll-behavior: none;
    font-family: monospace;
  }
  body {
    display: grid;
    place-items: center;
  }
  canvas {
    width: 100vw;
    height: 100vh;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #11151a;
    display: block;
  }
</style>
</head>
<body>
<canvas id="game" width="480" height="270"></canvas>

<script>
(() => {
  'use strict';

  const W = 480, H = 270;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = false;

  const keys = new Set();
  let mouseX = W/2, mouseY = H/2, mouseDown = false;

  const state = {
    score: 0,
    kills: 0,
    gameOver: false,
    shake: 0,
    time: 0
  };

  const player = {
    x: W/2, y: H/2,
    r: 9,
    hp: 100,
    maxHp: 100,
    speed: 86,
    bodyAngle: 0,
    turretAngle: 0,
    fireCooldown: 0,
    fireRate: 7.5,
    bulletSpeed: 220
  };

  const bullets = [];
  const enemyBullets = [];
  const enemies = [];
  const particles = [];
  const decals = [];

  let spawnTimer = 0;

  const joy = {
    active: false,
    id: null,
    sx: 70, sy: H - 58,
    x: 70, y: H - 58,
    dx: 0, dy: 0
  };

  const aimTouch = {
    active: false,
    id: null,
    x: W - 80, y: H/2
  };

  function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
  function dist2(ax,ay,bx,by){ const dx=ax-bx,dy=ay-by; return dx*dx+dy*dy; }
  function rand(a,b){ return a + Math.random()*(b-a); }

  function canvasPos(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (clientX-r.left)/r.width*W,
      y: (clientY-r.top)/r.height*H
    };
  }

  function spawnEnemy() {
    let x, y;
    const side = Math.floor(Math.random()*4);
    if (side === 0) { x = rand(10,W-10); y = 12; }
    if (side === 1) { x = W-12; y = rand(10,H-10); }
    if (side === 2) { x = rand(10,W-10); y = H-12; }
    if (side === 3) { x = 12; y = rand(10,H-10); }

    enemies.push({
      x,y,r:9,
      hp: 30,
      maxHp:30,
      speed: 31 + rand(-3,5),
      fireCooldown: rand(.2,1.1),
      fireRate: 0.8 + rand(-.1,.15),
      angle:0,
      hitFlash:0
    });
  }

  function shootPlayer() {
    const a = player.turretAngle;
    bullets.push({
      x: player.x + Math.cos(a)*12,
      y: player.y + Math.sin(a)*12,
      vx: Math.cos(a)*player.bulletSpeed,
      vy: Math.sin(a)*player.bulletSpeed,
      life: 1.35
    });
    player.fireCooldown = 1/player.fireRate;
    state.shake = Math.max(state.shake, 1.2);
    for (let i=0;i<3;i++) {
      particles.push({
        x: player.x + Math.cos(a)*13,
        y: player.y + Math.sin(a)*13,
        vx: Math.cos(a)*rand(18,50) + rand(-18,18),
        vy: Math.sin(a)*rand(18,50) + rand(-18,18),
        life: rand(.08,.18),
        maxLife:.18,
        type:'spark'
      });
    }
  }

  function shootEnemy(e) {
    const a = Math.atan2(player.y-e.y, player.x-e.x);
    enemyBullets.push({
      x:e.x+Math.cos(a)*10,
      y:e.y+Math.sin(a)*10,
      vx:Math.cos(a)*105,
      vy:Math.sin(a)*105,
      life:3
    });
    e.fireCooldown = 1/e.fireRate;
  }

  function explode(x,y,amount=16) {
    state.shake = Math.max(state.shake, 5);
    decals.push({x,y,r:rand(5,9),life:12});
    for(let i=0;i<amount;i++){
      const a=Math.random()*Math.PI*2;
      const s=rand(25,100);
      particles.push({
        x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
        life:rand(.2,.65),maxLife:.65,
        type:Math.random()<.65?'spark':'smoke'
      });
    }
  }

  function damagePlayer(dmg) {
    player.hp = Math.max(0, player.hp-dmg);
    state.shake = Math.max(state.shake, 4);
    if (player.hp <= 0) {
      state.gameOver = true;
      explode(player.x,player.y,35);
    }
  }

  function resetGame(){
    player.x=W/2; player.y=H/2; player.hp=100;
    bullets.length=0; enemyBullets.length=0; enemies.length=0; particles.length=0; decals.length=0;
    state.score=0; state.kills=0; state.gameOver=false; state.shake=0; state.time=0;
    spawnTimer=.3;
  }

  addEventListener('keydown', e => {
    keys.add(e.code);
    if (state.gameOver && (e.code === 'Space' || e.code === 'Enter')) resetGame();
  });
  addEventListener('keyup', e => keys.delete(e.code));

  canvas.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse') {
      const p=canvasPos(e.clientX,e.clientY);
      mouseX=p.x; mouseY=p.y;
    }
  });

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    canvas.setPointerCapture?.(e.pointerId);
    const p=canvasPos(e.clientX,e.clientY);

    if (state.gameOver) {
      resetGame();
      return;
    }

    if (e.pointerType === 'mouse') {
      mouseDown = true;
      mouseX=p.x; mouseY=p.y;
      return;
    }

    if (p.x < W*0.5 && !joy.active) {
      joy.active=true; joy.id=e.pointerId;
      joy.sx=p.x; joy.sy=p.y;
      joy.x=p.x; joy.y=p.y;
      joy.dx=0; joy.dy=0;
    } else if (!aimTouch.active) {
      aimTouch.active=true; aimTouch.id=e.pointerId;
      aimTouch.x=p.x; aimTouch.y=p.y;
    }
  }, {passive:false});

  canvas.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse') return;
    e.preventDefault();
    const p=canvasPos(e.clientX,e.clientY);

    if (joy.active && e.pointerId===joy.id) {
      joy.x=p.x; joy.y=p.y;
      let dx=joy.x-joy.sx, dy=joy.y-joy.sy;
      const len=Math.hypot(dx,dy);
      const max=27;
      if (len>max) { dx*=max/len; dy*=max/len; }
      joy.dx=dx/max; joy.dy=dy/max;
    }

    if (aimTouch.active && e.pointerId===aimTouch.id) {
      aimTouch.x=p.x; aimTouch.y=p.y;
    }
  }, {passive:false});

  function releasePointer(e){
    if (e.pointerType === 'mouse') {
      mouseDown=false;
      return;
    }
    if (joy.active && e.pointerId===joy.id) {
      joy.active=false; joy.id=null; joy.dx=0; joy.dy=0;
    }
    if (aimTouch.active && e.pointerId===aimTouch.id) {
      aimTouch.active=false; aimTouch.id=null;
    }
  }
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointercancel', releasePointer);
  canvas.addEventListener('contextmenu', e=>e.preventDefault());

  function update(dt) {
    if (state.gameOver) {
      for (let p of particles) {
        p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
        p.vx*=.96; p.vy*=.96;
      }
      for(let i=particles.length-1;i>=0;i--) if(particles[i].life<=0) particles.splice(i,1);
      return;
    }

    state.time += dt;
    player.fireCooldown -= dt;
    spawnTimer -= dt;

    if (spawnTimer <= 0) {
      spawnEnemy();
      const density = clamp(1.45 - state.time*0.01, .62, 1.45);
      spawnTimer = density;
    }

    let mx=0,my=0;
    if(keys.has('KeyA')||keys.has('ArrowLeft')) mx-=1;
    if(keys.has('KeyD')||keys.has('ArrowRight')) mx+=1;
    if(keys.has('KeyW')||keys.has('ArrowUp')) my-=1;
    if(keys.has('KeyS')||keys.has('ArrowDown')) my+=1;

    if (joy.active) { mx=joy.dx; my=joy.dy; }

    let ml=Math.hypot(mx,my);
    if(ml>1){mx/=ml;my/=ml;}
    if(Math.abs(mx)+Math.abs(my)>0.02){
      player.x += mx*player.speed*dt;
      player.y += my*player.speed*dt;
      player.bodyAngle = Math.atan2(my,mx);
    }

    player.x=clamp(player.x,12,W-12);
    player.y=clamp(player.y,12,H-12);

    let ax=mouseX, ay=mouseY;
    let firing = mouseDown;

    if (aimTouch.active) {
      ax=aimTouch.x; ay=aimTouch.y;
      firing=true;
    }

    player.turretAngle=Math.atan2(ay-player.y, ax-player.x);

    if(firing && player.fireCooldown<=0) shootPlayer();

    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];
      b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
      let hit=false;
      for(let j=enemies.length-1;j>=0;j--){
        const e=enemies[j];
        if(dist2(b.x,b.y,e.x,e.y) < (e.r+2)*(e.r+2)){
          e.hp-=15;
          e.hitFlash=.08;
          hit=true;
          for(let k=0;k<5;k++){
            const a=Math.random()*Math.PI*2;
            const s=rand(20,70);
            particles.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.08,.25),maxLife:.25,type:'spark'});
          }
          if(e.hp<=0){
            state.kills++;
            state.score+=100;
            explode(e.x,e.y,18);
            enemies.splice(j,1);
          }
          break;
        }
      }
      if(hit || b.life<=0 || b.x<0||b.x>W||b.y<0||b.y>H) bullets.splice(i,1);
    }

    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      e.fireCooldown-=dt; e.hitFlash-=dt;

      const a=Math.atan2(player.y-e.y, player.x-e.x);
      e.angle=a;
      const d=Math.hypot(player.x-e.x,player.y-e.y);

      if(d>82){
        e.x+=Math.cos(a)*e.speed*dt;
        e.y+=Math.sin(a)*e.speed*dt;
      } else if(d<60){
        e.x-=Math.cos(a)*e.speed*.6*dt;
        e.y-=Math.sin(a)*e.speed*.6*dt;
      }

      if(d<135 && e.fireCooldown<=0) shootEnemy(e);

      if(d<player.r+e.r+2){
        damagePlayer(18*dt);
      }
    }

    for(let i=enemyBullets.length-1;i>=0;i--){
      const b=enemyBullets[i];
      b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
      if(dist2(b.x,b.y,player.x,player.y) < (player.r+2)*(player.r+2)){
        damagePlayer(10);
        enemyBullets.splice(i,1);
        continue;
      }
      if(b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H) enemyBullets.splice(i,1);
    }

    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
      p.vx*=Math.pow(.025,dt);
      p.vy*=Math.pow(.025,dt);
      if(p.life<=0) particles.splice(i,1);
    }

    for(let i=decals.length-1;i>=0;i--){
      decals[i].life-=dt;
      if(decals[i].life<=0) decals.splice(i,1);
    }

    state.shake=Math.max(0,state.shake-dt*14);
  }

  function pxRect(x,y,w,h,c){
    ctx.fillStyle=c;
    ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
  }

  function drawGrid(){
    ctx.fillStyle='#14191f';
    ctx.fillRect(0,0,W,H);

    ctx.strokeStyle='#1d242c';
    ctx.lineWidth=1;
    for(let x=0;x<=W;x+=24){ctx.beginPath();ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H);ctx.stroke();}
    for(let y=0;y<=H;y+=24){ctx.beginPath();ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5);ctx.stroke();}

    for(let i=0;i<28;i++){
      const x=(i*83)%W, y=(i*47)%H;
      pxRect(x,y,2,2,'#222a33');
    }
  }

  function drawRobot(x,y,bodyA,turretA,enemy=false,flash=false){
    ctx.save();
    ctx.translate(Math.round(x),Math.round(y));
    ctx.rotate(bodyA);

    pxRect(-8,-7,16,14, flash?'#e9edf0':(enemy?'#6a2a2a':'#456478'));
    pxRect(-10,-5,3,10, enemy?'#35191a':'#263b49');
    pxRect(7,-5,3,10, enemy?'#35191a':'#263b49');
    pxRect(-5,-4,10,8, enemy?'#85403b':'#587f96');
    pxRect(-6,-8,4,2,'#111');
    pxRect(2,-8,4,2,'#111');

    ctx.restore();

    ctx.save();
    ctx.translate(Math.round(x),Math.round(y));
    ctx.rotate(turretA);
    pxRect(-4,-4,8,8, enemy?'#8d4a42':'#6e9db8');
    pxRect(2,-2,12,4, enemy?'#a85d52':'#88bad4');
    pxRect(12,-1,4,2, enemy?'#d97766':'#bfe8ff');
    ctx.restore();
  }

  function drawHUD(){
    pxRect(8,8,104,12,'#07090b');
    pxRect(10,10,100,8,'#242a31');
    pxRect(10,10,100*(player.hp/player.maxHp),8, player.hp>35?'#55a864':'#b85151');

    ctx.fillStyle='#e7edf2';
    ctx.font='10px monospace';
    ctx.fillText(`HP ${Math.ceil(player.hp)}`,12,18);
    ctx.fillText(`УНИЧТОЖЕНО: ${state.kills}`,8,34);
    ctx.fillText(`СЧЁТ: ${state.score}`,8,46);
    ctx.fillStyle='#9ca9b3';
    ctx.fillText('v0.1',W-31,14);
  }

  function drawTouchControls(){
    const touchLike = navigator.maxTouchPoints > 0;
    if(!touchLike) return;

    ctx.globalAlpha=.45;
    ctx.strokeStyle='#a7b4bf';
    ctx.lineWidth=2;

    const bx=joy.active?joy.sx:58, by=joy.active?joy.sy:H-52;
    ctx.beginPath();ctx.arc(bx,by,28,0,Math.PI*2);ctx.stroke();

    const kx=joy.active?joy.sx+joy.dx*27:58;
    const ky=joy.active?joy.sy+joy.dy*27:H-52;
    ctx.beginPath();ctx.arc(kx,ky,11,0,Math.PI*2);ctx.stroke();

    ctx.beginPath();ctx.arc(W-55,H-52,24,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#a7b4bf';
    ctx.font='9px monospace';
    ctx.fillText('ОГОНЬ',W-70,H-49);
    ctx.globalAlpha=1;
  }

  function render(){
    ctx.save();

    let sx=0,sy=0;
    if(state.shake>0){
      sx=rand(-state.shake,state.shake);
      sy=rand(-state.shake,state.shake);
    }
    ctx.translate(Math.round(sx),Math.round(sy));

    drawGrid();

    for(const d of decals){
      ctx.globalAlpha=clamp(d.life/2,0,.34);
      ctx.fillStyle='#050606';
      ctx.beginPath();ctx.arc(Math.round(d.x),Math.round(d.y),d.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;

    for(const b of bullets){
      pxRect(b.x-2,b.y-1,5,2,'#d9f4ff');
    }
    for(const b of enemyBullets){
      pxRect(b.x-2,b.y-2,4,4,'#ff9d74');
    }

    for(const e of enemies){
      drawRobot(e.x,e.y,e.angle,e.angle,true,e.hitFlash>0);
      pxRect(e.x-10,e.y-14,20,3,'#1a0d0d');
      pxRect(e.x-10,e.y-14,20*(e.hp/e.maxHp),3,'#a54a44');
    }

    if(!state.gameOver) drawRobot(player.x,player.y,player.bodyAngle,player.turretAngle,false,false);

    for(const p of particles){
      const alpha=clamp(p.life/p.maxLife,0,1);
      ctx.globalAlpha=alpha;
      if(p.type==='spark'){
        pxRect(p.x,p.y,2,2,'#ffd27a');
      }else{
        pxRect(p.x-2,p.y-2,4,4,'#59616a');
      }
    }
    ctx.globalAlpha=1;

    ctx.restore();

    drawHUD();
    drawTouchControls();

    if(state.gameOver){
      ctx.fillStyle='rgba(0,0,0,.72)';
      ctx.fillRect(0,0,W,H);
      ctx.textAlign='center';
      ctx.fillStyle='#f0f3f5';
      ctx.font='bold 22px monospace';
      ctx.fillText('РОБОТ УНИЧТОЖЕН',W/2,H/2-16);
      ctx.font='12px monospace';
      ctx.fillStyle='#c1c9cf';
      ctx.fillText(`Счёт: ${state.score}   Уничтожено: ${state.kills}`,W/2,H/2+8);
      ctx.fillText('Коснись экрана или нажми Enter',W/2,H/2+30);
      ctx.textAlign='left';
    } else {
      ctx.fillStyle='#85929c';
      ctx.font='9px monospace';
      if(navigator.maxTouchPoints===0){
        ctx.fillText('WASD — движение   мышь — прицел   ЛКМ — огонь',W/2-112,H-8);
      }
    }
  }

  let last=performance.now();
  function loop(now){
    const dt=Math.min(.033,(now-last)/1000);
    last=now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  for(let i=0;i<3;i++) spawnEnemy();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
