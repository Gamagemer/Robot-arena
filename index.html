function resize(){
  const d=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.round(innerWidth*d); canvas.height=Math.round(innerHeight*d);
  W=Math.max(320,Math.round(innerWidth)); H=Math.max(180,Math.round(innerHeight));
  ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0); ctx.imageSmoothingEnabled=false;
  leftStick.sy=H-52;
}
addEventListener('resize',resize,{passive:true}); resize();

function hash(x,y){ let n=(x*374761393+y*668265263)>>>0; n=(n^(n>>13))*1274126177>>>0; return (n^(n>>16))>>>0; }
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function iso(x,y){return {x:(x-y)*TW/2,y:(x+y)*TH/2};}
function worldToScreen(x,y){const p=iso(x,y);return{x:p.x-camera.x+W/2,y:p.y-camera.y+H/2};}
function tileVariant(x,y){return hash(x,y)%8;}

function loadImages(){
  return Promise.all(sandPaths.map(src=>new Promise((resolve,reject)=>{
    const im=new Image(); im.onload=()=>resolve(im); im.onerror=reject; im.src=src;
  }))).then(imgs=>{sand.push(...imgs); state.loaded=true;});
}

function buildMap(){
  tiles.length=0;
  for(let y=0;y<MAP_H;y++){
    const row=[];
    for(let x=0;x<MAP_W;x++) row.push(tileVariant(x,y));
    tiles.push(row);
  }
}
buildMap();

function drawBaseDiamond(sx,sy){
  ctx.fillStyle='#c88e58';
  ctx.beginPath(); ctx.moveTo(sx+32,sy); ctx.lineTo(sx+64,sy+16); ctx.lineTo(sx+32,sy+32); ctx.lineTo(sx,sy+16); ctx.closePath(); ctx.fill();
}
function drawTile(tx,ty){
  const p=worldToScreen(tx,ty); const sx=Math.round(p.x),sy=Math.round(p.y);
  if(sx<-70||sx>W+70||sy<-40||sy>H+40)return;
  drawBaseDiamond(sx,sy);
  const im=sand[tiles[ty][tx]];
  if(im) ctx.drawImage(im,sx,sy,TW,TH);
  if(state.showGrid){
    ctx.strokeStyle='rgba(60,37,22,.22)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(sx+32.5,sy+.5); ctx.lineTo(sx+63.5,sy+16); ctx.lineTo(sx+32.5,sy+31.5); ctx.lineTo(sx+.5,sy+16); ctx.closePath(); ctx.stroke();
  }
}

function drawRangeMarkings(){
  // Central spawn pad and four navigation guides; sand remains the only terrain type.
  const c=worldToScreen(14.5,11.5);
  ctx.save(); ctx.translate(Math.round(c.x),Math.round(c.y+8));
  ctx.strokeStyle='rgba(86,72,47,.82)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(0,0,38,19,0,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='rgba(226,185,85,.82)'; ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-15,0);ctx.lineTo(15,0);ctx.moveTo(0,-8);ctx.lineTo(0,8);ctx.stroke();
  ctx.restore();

  // test-lane dashed lines
  const lanes=[[[5,7],[12,7]],[[16,15],[23,15]],[[8,16],[8,10]],[[20,11],[20,5]]];
  ctx.setLineDash([7,6]); ctx.lineWidth=2; ctx.strokeStyle='rgba(104,78,41,.55)';
  for(const [a,b] of lanes){const p1=worldToScreen(a[0]+.5,a[1]+.5),p2=worldToScreen(b[0]+.5,b[1]+.5);ctx.beginPath();ctx.moveTo(p1.x,p1.y+8);ctx.lineTo(p2.x,p2.y+8);ctx.stroke();}
  ctx.setLineDash([]);
}

function drawBoundaryPosts(){
  const pts=[];
  for(let x=1;x<MAP_W-1;x+=3){pts.push([x,1],[x,MAP_H-2]);}
  for(let y=4;y<MAP_H-3;y+=3){pts.push([1,y],[MAP_W-2,y]);}
  for(const [x,y] of pts){
    const p=worldToScreen(x+.5,y+.5);
    if(p.x<-20||p.x>W+20||p.y<-30||p.y>H+30)continue;
    ctx.fillStyle='rgba(31,28,25,.35)';ctx.fillRect(Math.round(p.x-5),Math.round(p.y+8),10,3);
    ctx.fillStyle='#564c42';ctx.fillRect(Math.round(p.x-2),Math.round(p.y-8),4,16);
    ctx.fillStyle='#c58c42';ctx.fillRect(Math.round(p.x-3),Math.round(p.y-10),6,4);
    ctx.fillStyle='#f0b85d';ctx.fillRect(Math.round(p.x-1),Math.round(p.y-9),2,2);
  }
}

function drawRobot(){
  const p=worldToScreen(player.x,player.y); const x=Math.round(p.x),y=Math.round(p.y+8);
  const bob=player.moving?(Math.floor(player.walk*8)%2):0;
  ctx.save(); ctx.translate(x,y-bob);
  ctx.fillStyle='rgba(20,16,12,.30)'; ctx.beginPath();ctx.ellipse(0,8,18,7,0,0,Math.PI*2);ctx.fill();
  // four armored legs
  ctx.fillStyle='#334638';
  ctx.fillRect(-17,2,7,9);ctx.fillRect(10,2,7,9);ctx.fillRect(-13,-7,6,9);ctx.fillRect(7,-7,6,9);
  ctx.fillStyle='#55705b';
  ctx.fillRect(-16,1,5,5);ctx.fillRect(11,1,5,5);ctx.fillRect(-12,-8,4,5);ctx.fillRect(8,-8,4,5);
  // rounded body
  ctx.fillStyle='#26342b';ctx.fillRect(-12,-10,24,15);
  ctx.fillStyle='#4e6b53';ctx.fillRect(-10,-13,20,15);
  ctx.fillStyle='#6c8b69';ctx.fillRect(-7,-15,14,5);
  ctx.fillStyle='#1b2520';ctx.fillRect(-6,-8,12,7);
  ctx.fillStyle='#9aaa72';ctx.fillRect(-3,-11,6,3);
  // turret / barrel, rotates in 4 screen directions for readability
  ctx.rotate(player.dir);
  ctx.fillStyle='#202a25';ctx.fillRect(1,-3,18,5);ctx.fillStyle='#7c8d70';ctx.fillRect(4,-2,13,2);
  ctx.restore();
}

function update(dt){
  if(!state.started)return;
  state.time+=dt;
  let sx=0,sy=0;
  if(keys.has('ArrowLeft')||keys.has('KeyA'))sx-=1;
  if(keys.has('ArrowRight')||keys.has('KeyD'))sx+=1;
  if(keys.has('ArrowUp')||keys.has('KeyW'))sy-=1;
  if(keys.has('ArrowDown')||keys.has('KeyS'))sy+=1;
  if(leftStick.active){sx+=leftStick.dx;sy+=leftStick.dy;}
  const len=Math.hypot(sx,sy); player.moving=len>.08;
  if(player.moving){
    sx/=Math.max(1,len); sy/=Math.max(1,len);
    // Screen-space movement -> world axes for a 2:1 dimetric grid.
    let wx=(sx+2*sy)*.5, wy=(-sx+2*sy)*.5;
    const wl=Math.hypot(wx,wy)||1; wx/=wl;wy/=wl;
    player.x=clamp(player.x+wx*player.speed*dt,1.2,MAP_W-1.2);
    player.y=clamp(player.y+wy*player.speed*dt,1.2,MAP_H-1.2);
    player.dir=Math.atan2(sy,sx); player.walk+=dt;
  }
  const ip=iso(player.x,player.y);
  camera.x+=(ip.x-camera.x)*Math.min(1,dt*7);
  camera.y+=(ip.y-camera.y)*Math.min(1,dt*7);
}

function drawHUD(){
  ctx.fillStyle='rgba(12,14,15,.76)';ctx.fillRect(8,8,207,46);
  ctx.strokeStyle='rgba(225,190,124,.38)';ctx.strokeRect(8.5,8.5,206,45);
  ctx.fillStyle='#f0dfbf';ctx.font='bold 11px monospace';ctx.fillText('ПОЛИГОН — ПЕСОК 2:1',16,25);
  ctx.fillStyle='#c6b28f';ctx.font='9px monospace';ctx.fillText('8 вариаций • враги: отключены',16,40);
  ctx.fillStyle='#ad9b7c';ctx.font='8px monospace';ctx.fillText('v0.9.9',W-45,16);
  if(state.showHelp){
    const w=Math.min(290,W-24),x=(W-w)/2;
    ctx.fillStyle='rgba(10,12,13,.78)';ctx.fillRect(x,H-37,w,27);
    ctx.fillStyle='#dfd4bd';ctx.textAlign='center';ctx.font='8px monospace';
    ctx.fillText('WASD / стрелки — движение   G — сетка   H — подсказка',W/2,H-20);ctx.textAlign='left';
  }
}
function drawStick(){
  if(!('ontouchstart' in window))return;
  const bx=leftStick.active?leftStick.sx:58,by=leftStick.active?leftStick.sy:H-52;
  ctx.globalAlpha=.28;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(bx,by,29,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(bx+leftStick.dx*22,by+leftStick.dy*22,10,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
}
function drawStart(){
  ctx.fillStyle='rgba(8,9,10,.72)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.fillStyle='#f0dfbf';ctx.font='bold 20px monospace';ctx.fillText('ROBOT ARENA',W/2,H/2-40);
  ctx.fillStyle='#c89b56';ctx.font='10px monospace';ctx.fillText('ТЕСТОВЫЙ ПОЛИГОН • v0.9.9',W/2,H/2-20);
  ctx.fillStyle='#1e2423';ctx.fillRect(W/2-78,H/2+4,156,34);ctx.strokeStyle='#9b8b6b';ctx.strokeRect(W/2-77.5,H/2+4.5,155,33);
  ctx.fillStyle='#f4ead6';ctx.font='bold 11px monospace';ctx.fillText('ВОЙТИ НА ПОЛИГОН',W/2,H/2+25);ctx.textAlign='left';
}

function draw(){
  ctx.fillStyle='#17191b';ctx.fillRect(0,0,W,H);
  // Painter's order is essential for isometric ground.
  for(let sum=0;sum<MAP_W+MAP_H-1;sum++){
    for(let y=0;y<MAP_H;y++){
      const x=sum-y;if(x>=0&&x<MAP_W)drawTile(x,y);
    }
  }
  drawRangeMarkings();drawBoundaryPosts();drawRobot();drawHUD();drawStick();
  if(!state.started)drawStart();
}

addEventListener('keydown',e=>{
  keys.add(e.code);
  if(e.code==='KeyG')state.showGrid=!state.showGrid;
  if(e.code==='KeyH')state.showHelp=!state.showHelp;
  if(!state.started&&(e.code==='Enter'||e.code==='Space'))state.started=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
},{passive:false});
addEventListener('keyup',e=>keys.delete(e.code));

canvas.addEventListener('pointerdown',e=>{
  if(!state.started){state.started=true;return;}
  if(e.clientX<W*.48){leftStick.active=true;leftStick.id=e.pointerId;leftStick.sx=e.clientX;leftStick.sy=e.clientY;leftStick.dx=leftStick.dy=0;canvas.setPointerCapture(e.pointerId);}
});
canvas.addEventListener('pointermove',e=>{
  if(leftStick.active&&e.pointerId===leftStick.id){let dx=e.clientX-leftStick.sx,dy=e.clientY-leftStick.sy;const l=Math.hypot(dx,dy)||1,m=Math.min(1,l/30);leftStick.dx=dx/l*m;leftStick.dy=dy/l*m;}
});
function endPointer(e){if(leftStick.active&&e.pointerId===leftStick.id){leftStick.active=false;leftStick.id=null;leftStick.dx=leftStick.dy=0;}}
canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);

let last=performance.now();
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop);} 
loadImages().catch(err=>console.error('Sand tile load error',err));
const c=iso(player.x,player.y);camera.x=c.x;camera.y=c.y;requestAnimationFrame(loop);
})();
</script>
</body>
