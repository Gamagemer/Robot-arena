<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Robot Arena v0.3</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #090c0b;
    touch-action: none;
    overscroll-behavior: none;
    font-family: monospace;
  }
  body { display:grid; place-items:center; }
  canvas {
    display:block;
    width:100vw;
    height:100dvh;
    background:#172016;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    touch-action:none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', {alpha:false});
ctx.imageSmoothingEnabled = false;

let W=480, H=270;
const WORLD_W=1600, WORLD_H=1100;

const keys = new Set();
let mouseX=240, mouseY=135, mouseDown=false;

const bullets=[];
const enemyBullets=[];
const enemies=[];
const particles=[];
const scraps=[];

const state={
  score:0,kills:0,time:0,shake:0,gameOver:false,
  pausedForUpgrade:false,level:1,xp:0,xpNeed:5,
  spawnClock:0
};

const player={
  x:800,y:550,r:9,hp:100,maxHp:100,speed:92,
  damage:15,fireRate:7.5,bulletSpeed:240,fireCooldown:0,
  bodyAngle:0,turretAngle:0
};

const camera={x:0,y:0};

const leftStick={active:false,id:null,sx:55,sy:220,dx:0,dy:0};
const rightStick={active:false,id:null,sx:425,sy:220,dx:0,dy:0};

const upgradeChoices=[
  {name:'УСИЛЕННЫЕ СНАРЯДЫ',desc:'+25% урона',apply(){player.damage*=1.25;}},
  {name:'УСКОРЕННЫЙ ЗАТВОР',desc:'+20% скорострельности',apply(){player.fireRate*=1.20;}},
  {name:'УСИЛЕННАЯ БРОНЯ',desc:'+20 HP и лечение',apply(){player.maxHp+=20;player.hp=Math.min(player.maxHp,player.hp+35);}}
];

const roads=[
  {x:0,y:505,w:1600,h:92,type:'horizontal'},
  {x:735,y:0,w:110,h:1100,type:'vertical'},
  {x:1020,y:200,w:360,h:72,type:'horizontal'}
];

const fields=[
  {x:90,y:90,w:350,h:270},
  {x:1110,y:70,w:360,h:250},
  {x:115,y:745,w:405,h:270},
  {x:1030,y:720,w:390,h:280}
];

const walls=[
  // farm houses / barns
  {x:520,y:365,w:120,h:70,kind:'barn'},
  {x:930,y:350,w:105,h:65,kind:'house'},
  {x:1220,y:410,w:130,h:78,kind:'barn'},
  {x:310,y:570,w:115,h:65,kind:'house'},
  {x:610,y:700,w:135,h:80,kind:'barn'},
  {x:865,y:720,w:100,h:62,kind:'house'},
  // sheds
  {x:145,y:425,w:72,h:44,kind:'shed'},
  {x:1380,y:580,w:74,h:44,kind:'shed'},
  // fences treated as obstacle blocks
  {x:70,y:380,w:340,h:12,kind:'fence'},
  {x:70,y:380,w:12,h:260,kind:'fence'},
  {x:70,y:628,w:250,h:12,kind:'fence'},
  {x:1080,y:340,w:360,h:12,kind:'fence'},
  {x:1428,y:340,w:12,h:240,kind:'fence'},
  {x:1100,y:568,w:340,h:12,kind:'fence'}
];

const ponds=[
  {x:470,y:870,rx:95,ry:55},
  {x:1280,y:850,rx:115,ry:70}
];

const spawners=[
  {x:165,y:175,timer:1.0,rate:4.4},
  {x:1400,y:165,timer:2.0,rate:4.8},
  {x:180,y:930,timer:3.0,rate:5.0},
  {x:1410,y:940,timer:2.6,rate:4.6},
  {x:810,y:155,timer:3.5,rate:5.4},
  {x:800,y:950,timer:1.8,rate:5.2}
];

const shrubs=[];
const trees=[];
const hay=[];
for(let i=0;i<90;i++){
  shrubs.push({x:(i*173)%WORLD_W,y:(i*257+91)%WORLD_H,s:2+(i%3)});
}
for(let i=0;i<45;i++){
  trees.push({x:(i*281+130)%WORLD_W,y:(i*193+80)%WORLD_H});
}
for(let i=0;i<32;i++){
  hay.push({x:(i*227+50)%WORLD_W,y:(i*149+250)%WORLD_H});
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rand(a,b){return a+Math.random()*(b-a);}
function d2(ax,ay,bx,by){const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;}

function resizeGame(){
  const portrait=innerHeight>innerWidth;
  W=portrait?270:480;
  H=portrait?480:270;
  canvas.width=W;canvas.height=H;
  leftStick.sx=52; leftStick.sy=H-48;
  rightStick.sx=W-52; rightStick.sy=H-48;
}
addEventListener('resize',resizeGame);

function worldToScreen(x,y){return {x:x-camera.x,y:y-camera.y};}
function screenToWorld(x,y){return {x:x+camera.x,y:y+camera.y};}

function circleRectPush(obj,r){
  const nx=clamp(obj.x,r.x,r.x+r.w);
  const ny=clamp(obj.y,r.y,r.y+r.h);
  let dx=obj.x-nx,dy=obj.y-ny;
  let dd=dx*dx+dy*dy;
  if(dd<obj.r*obj.r){
    if(dd===0){
      const dl=Math.abs(obj.x-r.x),dr=Math.abs(obj.x-(r.x+r.w));
      const dt=Math.abs(obj.y-r.y),db=Math.abs(obj.y-(r.y+r.h));
      const m=Math.min(dl,dr,dt,db);
      if(m===dl)obj.x=r.x-obj.r;
      else if(m===dr)obj.x=r.x+r.w+obj.r;
      else if(m===dt)obj.y=r.y-obj.r;
      else obj.y=r.y+r.h+obj.r;
      return true;
    }
    const d=Math.sqrt(dd),push=obj.r-d;
    obj.x+=dx/d*push;obj.y+=dy/d*push;
    return true;
  }
  return false;
}

function inPond(x,y){
  for(const p of ponds){
    const dx=(x-p.x)/p.rx,dy=(y-p.y)/p.ry;
    if(dx*dx+dy*dy<1) return true;
  }
  return false;
}
function pointInWall(x,y){
  for(const r of walls) if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)return true;
  return false;
}

function burst(x,y,type,count=7){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,s=rand(20,90);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.12,.52),maxLife:.52,type});
  }
}
function explode(x,y){state.shake=Math.max(state.shake,5);burst(x,y,'spark',12);burst(x,y,'smoke',8);}

function spawnEnemyFrom(s){
  if(enemies.length>=22)return;
  const a=Math.random()*Math.PI*2;
  const r=18+Math.random()*20;
  enemies.push({
    x:clamp(s.x+Math.cos(a)*r,12,WORLD_W-12),
    y:clamp(s.y+Math.sin(a)*r,12,WORLD_H-12),
    r:9,hp:34,maxHp:34,speed:29+rand(-2,7),
    fireCooldown:rand(.2,1.2),fireRate:.72+rand(-.08,.16),
    angle:0,hitFlash:0
  });
  burst(s.x,s.y,'spawn',8);
}

function dropScrap(x,y){
  const n=1+(Math.random()<.35?1:0);
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,r=rand(3,12);
    scraps.push({x:x+Math.cos(a)*r,y:y+Math.sin(a)*r,vx:Math.cos(a)*rand(10,28),vy:Math.sin(a)*rand(10,28)});
  }
}

function checkLevelUp(){
  if(state.xp>=state.xpNeed&&!state.pausedForUpgrade){
    state.xp-=state.xpNeed;
    state.level++;
    state.xpNeed=Math.round(state.xpNeed*1.45+1);
    state.pausedForUpgrade=true;
  }
}
function chooseUpgrade(i){
  if(!state.pausedForUpgrade)return;
  upgradeChoices[i].apply();
  state.pausedForUpgrade=false;
}
function shootPlayer(){
  const a=player.turretAngle;
  bullets.push({x:player.x+Math.cos(a)*13,y:player.y+Math.sin(a)*13,
    vx:Math.cos(a)*player.bulletSpeed,vy:Math.sin(a)*player.bulletSpeed,life:1.5});
  player.fireCooldown=1/player.fireRate;
  burst(player.x+Math.cos(a)*14,player.y+Math.sin(a)*14,'muzzle',3);
  state.shake=Math.max(state.shake,1.2);
}
function shootEnemy(e){
  const a=Math.atan2(player.y-e.y,player.x-e.x);
  enemyBullets.push({x:e.x+Math.cos(a)*11,y:e.y+Math.sin(a)*11,
    vx:Math.cos(a)*108,vy:Math.sin(a)*108,life:3});
  e.fireCooldown=1/e.fireRate;
}
function damagePlayer(v){
  if(state.gameOver)return;
  player.hp=Math.max(0,player.hp-v);
  state.shake=Math.max(state.shake,4);
  if(player.hp<=0){state.gameOver=true;explode(player.x,player.y);}
}

function resetGame(){
  bullets.length=0;enemyBullets.length=0;enemies.length=0;particles.length=0;scraps.length=0;
  state.score=0;state.kills=0;state.time=0;state.shake=0;state.gameOver=false;state.pausedForUpgrade=false;
  state.level=1;state.xp=0;state.xpNeed=5;
  player.x=800;player.y=550;player.hp=100;player.maxHp=100;player.speed=92;player.damage=15;player.fireRate=7.5;
  for(let i=0;i<spawners.length;i++)spawners[i].timer=1.5+i*.55;
  updateCamera(true);
}

function updateCamera(snap=false){
  const tx=clamp(player.x-W/2,0,WORLD_W-W);
  const ty=clamp(player.y-H/2,0,WORLD_H-H);
  if(snap){camera.x=tx;camera.y=ty;}
  else{
    camera.x+=(tx-camera.x)*0.14;
    camera.y+=(ty-camera.y)*0.14;
  }
}

function canvasPos(clientX,clientY){
  const r=canvas.getBoundingClientRect();
  return {x:(clientX-r.left)/r.width*W,y:(clientY-r.top)/r.height*H};
}

addEventListener('keydown',e=>{
  keys.add(e.code);
  if(state.gameOver&&(e.code==='Enter'||e.code==='Space'))resetGame();
  if(state.pausedForUpgrade){
    if(e.code==='Digit1')chooseUpgrade(0);
    if(e.code==='Digit2')chooseUpgrade(1);
    if(e.code==='Digit3')chooseUpgrade(2);
  }
});
addEventListener('keyup',e=>keys.delete(e.code));

canvas.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){const p=canvasPos(e.clientX,e.clientY);mouseX=p.x;mouseY=p.y;}
});
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  canvas.setPointerCapture?.(e.pointerId);
  const p=canvasPos(e.clientX,e.clientY);
  if(state.gameOver){resetGame();return;}
  if(state.pausedForUpgrade){
    const cards=getUpgradeCards();
    for(let i=0;i<cards.length;i++){
      const c=cards[i];
      if(p.x>=c.x&&p.x<=c.x+c.w&&p.y>=c.y&&p.y<=c.y+c.h){chooseUpgrade(i);return;}
    }
    return;
  }
  if(e.pointerType==='mouse'){mouseDown=true;mouseX=p.x;mouseY=p.y;return;}
  if(p.x<W/2&&!leftStick.active){
    leftStick.active=true;leftStick.id=e.pointerId;leftStick.sx=p.x;leftStick.sy=p.y;leftStick.dx=0;leftStick.dy=0;
  }else if(!rightStick.active){
    rightStick.active=true;rightStick.id=e.pointerId;rightStick.sx=p.x;rightStick.sy=p.y;rightStick.dx=0;rightStick.dy=0;
  }
},{passive:false});
canvas.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse')return;
  e.preventDefault();
  const p=canvasPos(e.clientX,e.clientY);
  function upd(s){
    let dx=p.x-s.sx,dy=p.y-s.sy;
    const len=Math.hypot(dx,dy),max=28;
    if(len>max){dx*=max/len;dy*=max/len;}
    s.dx=dx/max;s.dy=dy/max;
  }
  if(leftStick.active&&e.pointerId===leftStick.id)upd(leftStick);
  if(rightStick.active&&e.pointerId===rightStick.id)upd(rightStick);
},{passive:false});
function releasePointer(e){
  if(e.pointerType==='mouse'){mouseDown=false;return;}
  if(leftStick.active&&e.pointerId===leftStick.id){leftStick.active=false;leftStick.id=null;leftStick.dx=0;leftStick.dy=0;}
  if(rightStick.active&&e.pointerId===rightStick.id){rightStick.active=false;rightStick.id=null;rightStick.dx=0;rightStick.dy=0;}
}
canvas.addEventListener('pointerup',releasePointer);
canvas.addEventListener('pointercancel',releasePointer);
canvas.addEventListener('contextmenu',e=>e.preventDefault());

function update(dt){
  if(state.gameOver||state.pausedForUpgrade){
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=.96;p.vy*=.96;
      if(p.life<=0)particles.splice(i,1);
    }
    return;
  }

  state.time+=dt;
  player.fireCooldown-=dt;

  for(const s of spawners){
    s.timer-=dt;
    const near=d2(s.x,s.y,player.x,player.y)<700*700;
    if(s.timer<=0&&near){
      spawnEnemyFrom(s);
      s.timer=s.rate*rand(.85,1.15);
    }
  }

  let mx=0,my=0;
  if(keys.has('KeyA')||keys.has('ArrowLeft'))mx-=1;
  if(keys.has('KeyD')||keys.has('ArrowRight'))mx+=1;
  if(keys.has('KeyW')||keys.has('ArrowUp'))my-=1;
  if(keys.has('KeyS')||keys.has('ArrowDown'))my+=1;
  if(leftStick.active){mx=leftStick.dx;my=leftStick.dy;}
  let ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}

  let moveSpeed=player.speed*(inPond(player.x,player.y)?.62:1);
  if(Math.abs(mx)+Math.abs(my)>.02){
    player.x+=mx*moveSpeed*dt;player.y+=my*moveSpeed*dt;player.bodyAngle=Math.atan2(my,mx);
  }
  player.x=clamp(player.x,12,WORLD_W-12);player.y=clamp(player.y,12,WORLD_H-12);
  for(const r of walls)circleRectPush(player,r);

  let firing=mouseDown;
  if(rightStick.active){
    const mag=Math.hypot(rightStick.dx,rightStick.dy);
    if(mag>.18){player.turretAngle=Math.atan2(rightStick.dy,rightStick.dx);firing=true;}
  }else{
    const mw=screenToWorld(mouseX,mouseY);
    player.turretAngle=Math.atan2(mw.y-player.y,mw.x-player.x);
  }
  if(firing&&player.fireCooldown<=0)shootPlayer();

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(pointInWall(b.x,b.y)){burst(b.x,b.y,'spark',4);bullets.splice(i,1);continue;}
    let removed=false;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(d2(b.x,b.y,e.x,e.y)<(e.r+2)*(e.r+2)){
        e.hp-=player.damage;e.hitFlash=.07;burst(b.x,b.y,'spark',5);bullets.splice(i,1);removed=true;
        if(e.hp<=0){explode(e.x,e.y);dropScrap(e.x,e.y);enemies.splice(j,1);state.kills++;state.score+=100;}
        break;
      }
    }
    if(removed)continue;
    if(b.life<=0||b.x<0||b.x>WORLD_W||b.y<0||b.y>WORLD_H)bullets.splice(i,1);
  }

  // enemy movement + simple separation
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];
    e.fireCooldown-=dt;e.hitFlash-=dt;
    let a=Math.atan2(player.y-e.y,player.x-e.x);
    const d=Math.hypot(player.x-e.x,player.y-e.y);

    let vx=0,vy=0;
    if(d>82){vx=Math.cos(a)*e.speed;vy=Math.sin(a)*e.speed;}
    else if(d<58){vx=-Math.cos(a)*e.speed*.5;vy=-Math.sin(a)*e.speed*.5;}

    for(let j=0;j<enemies.length;j++){
      if(i===j)continue;
      const o=enemies[j];
      const dx=e.x-o.x,dy=e.y-o.y,dd=dx*dx+dy*dy;
      if(dd>0&&dd<24*24){
        const q=Math.sqrt(dd);
        vx+=(dx/q)*18;vy+=(dy/q)*18;
      }
    }

    e.x+=vx*dt;e.y+=vy*dt;e.angle=a;
    e.x=clamp(e.x,10,WORLD_W-10);e.y=clamp(e.y,10,WORLD_H-10);
    for(const r of walls)circleRectPush(e,r);

    if(d<145&&e.fireCooldown<=0)shootEnemy(e);
    if(d<player.r+e.r+2)damagePlayer(18*dt);
  }

  for(let i=enemyBullets.length-1;i>=0;i--){
    const b=enemyBullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(pointInWall(b.x,b.y)){enemyBullets.splice(i,1);continue;}
    if(d2(b.x,b.y,player.x,player.y)<(player.r+2)*(player.r+2)){
      damagePlayer(10);enemyBullets.splice(i,1);continue;
    }
    if(b.life<=0||b.x<0||b.x>WORLD_W||b.y<0||b.y>WORLD_H)enemyBullets.splice(i,1);
  }

  for(let i=scraps.length-1;i>=0;i--){
    const s=scraps[i];s.x+=s.vx*dt;s.y+=s.vy*dt;
    s.vx*=Math.pow(.05,dt);s.vy*=Math.pow(.05,dt);
    const dd=Math.sqrt(d2(s.x,s.y,player.x,player.y));
    if(dd<48){const a=Math.atan2(player.y-s.y,player.x-s.x),pull=(48-dd)*4;s.x+=Math.cos(a)*pull*dt;s.y+=Math.sin(a)*pull*dt;}
    if(dd<12){state.xp++;state.score+=25;scraps.splice(i,1);checkLevelUp();}
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=Math.pow(.03,dt);p.vy*=Math.pow(.03,dt);
    if(p.life<=0)particles.splice(i,1);
  }

  state.shake=Math.max(0,state.shake-dt*15);
  updateCamera(false);
}

function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function visibleRect(x,y,w,h){return x+w>=camera.x&&x<=camera.x+W&&y+h>=camera.y&&y<=camera.y+H;}

function drawGround(){
  ctx.fillStyle='#65784c';ctx.fillRect(0,0,W,H);

  // subtle grass tiles
  const startX=Math.floor(camera.x/24)*24;
  const startY=Math.floor(camera.y/24)*24;
  for(let x=startX;x<camera.x+W+24;x+=24){
    for(let y=startY;y<camera.y+H+24;y+=24){
      const sx=x-camera.x,sy=y-camera.y;
      if(((x/24+y/24)|0)%2===0)px(sx,sy,24,24,'#627548');
      else px(sx,sy,24,24,'#687b4f');
    }
  }

  for(const f of fields){
    if(!visibleRect(f.x,f.y,f.w,f.h))continue;
    const sx=f.x-camera.x,sy=f.y-camera.y;
    px(sx,sy,f.w,f.h,'#8b7a45');
    for(let yy=f.y+10;yy<f.y+f.h;yy+=16){
      px(f.x-camera.x,yy-camera.y,f.w,3,'#74663b');
    }
  }

  for(const r of roads){
    if(!visibleRect(r.x,r.y,r.w,r.h))continue;
    const sx=r.x-camera.x,sy=r.y-camera.y;
    px(sx,sy,r.w,r.h,'#9a835e');
    if(r.type==='horizontal'){
      for(let x=r.x+8;x<r.x+r.w;x+=32)px(x-camera.x,r.y+r.h/2-camera.y,18,3,'#b39b73');
    }else{
      for(let y=r.y+8;y<r.y+r.h;y+=32)px(r.x+r.w/2-camera.x,y-camera.y,3,18,'#b39b73');
    }
  }

  for(const p of ponds){
    if(p.x+p.rx<camera.x||p.x-p.rx>camera.x+W||p.y+p.ry<camera.y||p.y-p.ry>camera.y+H)continue;
    ctx.fillStyle='#4a7073';
    ctx.beginPath();
    ctx.ellipse(Math.round(p.x-camera.x),Math.round(p.y-camera.y),p.rx,p.ry,0,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#6f8b79';ctx.lineWidth=3;ctx.stroke();
  }

  for(const s of shrubs){
    if(s.x<camera.x-8||s.x>camera.x+W+8||s.y<camera.y-8||s.y>camera.y+H+8)continue;
    px(s.x-camera.x,s.y-camera.y,s.s+2,s.s,'#3f5d35');
    px(s.x-camera.x+1,s.y-camera.y-2,s.s,s.s,'#527242');
  }

  for(const h of hay){
    if(h.x<camera.x-10||h.x>camera.x+W+10||h.y<camera.y-10||h.y>camera.y+H+10)continue;
    px(h.x-camera.x-5,h.y-camera.y-4,10,8,'#b99a4d');
    px(h.x-camera.x-4,h.y-camera.y-3,8,2,'#d0b45d');
  }
}

function drawTree(t){
  const sx=t.x-camera.x,sy=t.y-camera.y;
  px(sx-3,sy+4,6,10,'#5b3f27');
  px(sx-9,sy-8,18,16,'#315a34');
  px(sx-5,sy-12,12,10,'#447045');
  px(sx-11,sy-2,8,8,'#3a663a');
}

function drawStructure(r){
  const sx=r.x-camera.x,sy=r.y-camera.y;
  if(r.kind==='fence'){
    px(sx,sy,r.w,r.h,'#70573a');
    if(r.w>r.h){
      for(let x=0;x<r.w;x+=18)px(sx+x,sy-3,3,r.h+6,'#92734d');
    }else{
      for(let y=0;y<r.h;y+=18)px(sx-3,sy+y,r.w+6,3,'#92734d');
    }
    return;
  }
  if(r.kind==='barn'){
    px(sx,sy,r.w,r.h,'#8f4c3d');
    px(sx,sy,r.w,10,'#5b3029');
    px(sx+8,sy+18,r.w-16,r.h-26,'#a85e49');
    px(sx+r.w/2-12,sy+r.h-30,24,30,'#50352a');
    px(sx+r.w/2-9,sy+r.h-27,18,27,'#694536');
  }else if(r.kind==='house'){
    px(sx,sy,r.w,r.h,'#c0ad7c');
    px(sx,sy,r.w,9,'#6c4935');
    px(sx+10,sy+18,18,15,'#59717b');
    px(sx+r.w-28,sy+18,18,15,'#59717b');
    px(sx+r.w/2-10,sy+r.h-26,20,26,'#6f4c36');
  }else{
    px(sx,sy,r.w,r.h,'#81745d');
    px(sx,sy,r.w,8,'#51483c');
  }
}

function drawSpawner(s){
  const sx=s.x-camera.x,sy=s.y-camera.y;
  const pulse=2+Math.sin(state.time*4+s.x)*2;
  ctx.strokeStyle='#6a2328';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(Math.round(sx),Math.round(sy),13+pulse,0,Math.PI*2);ctx.stroke();
  px(sx-8,sy-5,16,10,'#5f2b2d');
  px(sx-3,sy-10,6,20,'#b74949');
  px(sx-8,sy-1,16,3,'#d25b56');
}

function drawRobotWorld(x,y,bodyA,turretA,enemy=false,flash=false){
  const sx=x-camera.x,sy=y-camera.y;
  ctx.save();ctx.translate(Math.round(sx),Math.round(sy));ctx.rotate(bodyA);
  const dark=enemy?'#3d2023':'#203c4c';
  const mid=flash?'#f0f1f2':(enemy?'#8f3d3f':'#4c7c97');
  const light=enemy?'#bf5950':'#76b5d2';
  px(-10,-7,4,14,dark);px(6,-7,4,14,dark);px(-8,-8,16,16,mid);px(-5,-5,10,10,light);
  px(-7,-10,4,3,'#11161a');px(3,-10,4,3,'#11161a');px(-7,7,4,3,'#11161a');px(3,7,4,3,'#11161a');
  ctx.restore();
  ctx.save();ctx.translate(Math.round(sx),Math.round(sy));ctx.rotate(turretA);
  px(-5,-5,10,10,enemy?'#9b4847':'#5f95ae');px(2,-2,11,4,enemy?'#d16f62':'#9bd4ec');px(12,-1,4,2,'#dceff8');
  ctx.restore();
}

function drawWorld(){
  drawGround();
  for(const t of trees){
    if(t.x>=camera.x-16&&t.x<=camera.x+W+16&&t.y>=camera.y-20&&t.y<=camera.y+H+20)drawTree(t);
  }
  for(const r of walls)if(visibleRect(r.x,r.y,r.w,r.h))drawStructure(r);
  for(const s of spawners){
    if(s.x>=camera.x-25&&s.x<=camera.x+W+25&&s.y>=camera.y-25&&s.y<=camera.y+H+25)drawSpawner(s);
  }

  for(const s of scraps){
    const p=worldToScreen(s.x,s.y);
    px(p.x-3,p.y-3,6,6,'#e2b35c');px(p.x-1,p.y-5,2,10,'#f0cf7d');px(p.x-5,p.y-1,10,2,'#8d6a34');
  }

  for(const b of bullets){
    const p=worldToScreen(b.x,b.y);px(p.x-2,p.y-1,5,2,'#d8f4ff');
  }
  for(const b of enemyBullets){
    const p=worldToScreen(b.x,b.y);px(p.x-2,p.y-2,4,4,'#ff8c69');
  }

  for(const e of enemies){
    if(e.x<camera.x-20||e.x>camera.x+W+20||e.y<camera.y-20||e.y>camera.y+H+20)continue;
    drawRobotWorld(e.x,e.y,e.angle,e.angle,true,e.hitFlash>0);
    const p=worldToScreen(e.x,e.y);
    px(p.x-10,p.y-15,20,3,'#190d0e');px(p.x-10,p.y-15,20*(e.hp/e.maxHp),3,'#ad4d49');
  }
  if(!state.gameOver)drawRobotWorld(player.x,player.y,player.bodyAngle,player.turretAngle,false,false);

  for(const p of particles){
    const s=worldToScreen(p.x,p.y);
    if(s.x<-10||s.x>W+10||s.y<-10||s.y>H+10)continue;
    const a=clamp(p.life/p.maxLife,0,1);ctx.globalAlpha=a;
    if(p.type==='smoke')px(s.x-2,s.y-2,5,5,'#545f68');
    else if(p.type==='spawn')px(s.x-2,s.y-2,4,4,'#d55a58');
    else if(p.type==='muzzle')px(s.x-2,s.y-1,4,2,'#fff0a7');
    else px(s.x,s.y,2,2,'#ffd16a');
  }
  ctx.globalAlpha=1;
}

function drawHUD(){
  px(7,7,104,12,'#06080b');px(9,9,100,8,'#242b31');
  px(9,9,100*(player.hp/player.maxHp),8,player.hp>35?'#58a968':'#ba5151');
  ctx.fillStyle='#f0f2f2';ctx.font='10px monospace';
  ctx.fillText(`HP ${Math.ceil(player.hp)}/${player.maxHp}`,11,18);
  ctx.fillText(`УР. ${state.level}`,7,33);ctx.fillText(`УНИЧТОЖЕНО: ${state.kills}`,7,46);
  const barW=Math.min(125,W-14);px(7,54,barW,7,'#111519');px(8,55,(barW-2)*(state.xp/state.xpNeed),5,'#d7b15e');
  ctx.fillStyle='#e0d1a1';ctx.fillText(`ДЕТАЛИ ${state.xp}/${state.xpNeed}`,7,72);
  ctx.fillStyle='#d9e0d3';ctx.fillText('v0.3',W-31,14);
}

function drawMiniMap(){
  const mw=64,mh=44,x=W-mw-7,y=24;
  ctx.globalAlpha=.82;
  px(x,y,mw,mh,'#172018');
  ctx.strokeStyle='#d5dbc9';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,mw-1,mh-1);
  for(const s of spawners){
    px(x+(s.x/WORLD_W)*mw-1,y+(s.y/WORLD_H)*mh-1,3,3,'#c85151');
  }
  px(x+(player.x/WORLD_W)*mw-1,y+(player.y/WORLD_H)*mh-1,3,3,'#8fd9ef');
  ctx.globalAlpha=1;
}

function drawStick(s,dx,dy,label){
  const bx=s.active?s.sx:dx,by=s.active?s.sy:dy;
  const kx=bx+s.dx*28,ky=by+s.dy*28;
  ctx.globalAlpha=.32;ctx.strokeStyle='#e5e8e2';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(bx,by,28,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(kx,ky,11,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#e5e8e2';ctx.font='8px monospace';ctx.textAlign='center';ctx.fillText(label,bx,by+42);ctx.textAlign='left';ctx.globalAlpha=1;
}
function drawTouchControls(){
  if(navigator.maxTouchPoints<=0)return;
  drawStick(leftStick,52,H-48,'ДВИЖЕНИЕ');drawStick(rightStick,W-52,H-48,'ОГОНЬ');
}
function getUpgradeCards(){
  const gap=7;
  if(H>W){const w=W-28,h=74,x=14;return[{x,y:H/2-120,w,h},{x,y:H/2-39,w,h},{x,y:H/2+42,w,h}];}
  const w=138,h=92,total=w*3+gap*2,sx=(W-total)/2;
  return[{x:sx,y:H/2-46,w,h},{x:sx+w+gap,y:H/2-46,w,h},{x:sx+(w+gap)*2,y:H/2-46,w,h}];
}
function drawUpgrade(){
  ctx.fillStyle='rgba(4,6,5,.88)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#f4f6f2';ctx.font='bold 15px monospace';ctx.textAlign='center';
  ctx.fillText(`УРОВЕНЬ ${state.level}`,W/2,H>W?H/2-153:48);
  ctx.font='10px monospace';ctx.fillStyle='#aab4a8';ctx.fillText('ВЫБЕРИ УЛУЧШЕНИЕ',W/2,H>W?H/2-136:63);
  const cards=getUpgradeCards();
  cards.forEach((c,i)=>{
    px(c.x,c.y,c.w,c.h,'#1b2520');px(c.x,c.y,c.w,3,'#819082');px(c.x+5,c.y+5,19,19,'#304139');
    ctx.fillStyle='#eef1eb';ctx.font='bold 9px monospace';ctx.textAlign='left';ctx.fillText(`${i+1}. ${upgradeChoices[i].name}`,c.x+9,c.y+34);
    ctx.fillStyle='#d2ba6c';ctx.font='9px monospace';ctx.fillText(upgradeChoices[i].desc,c.x+9,c.y+51);
  });
  ctx.textAlign='left';
}

function render(){
  ctx.save();
  let ox=0,oy=0;if(state.shake>0){ox=rand(-state.shake,state.shake);oy=rand(-state.shake,state.shake);}
  ctx.translate(Math.round(ox),Math.round(oy));
  drawWorld();
  ctx.restore();

  drawHUD();drawMiniMap();drawTouchControls();

  if(state.pausedForUpgrade)drawUpgrade();

  if(state.gameOver){
    ctx.fillStyle='rgba(0,0,0,.78)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f4f5f3';ctx.font='bold 19px monospace';ctx.textAlign='center';
    ctx.fillText('РОБОТ УНИЧТОЖЕН',W/2,H/2-25);
    ctx.font='10px monospace';ctx.fillStyle='#bec7bd';
    ctx.fillText(`Счёт ${state.score}   Врагов ${state.kills}   Уровень ${state.level}`,W/2,H/2);
    ctx.fillText('Коснись экрана для новой игры',W/2,H/2+22);ctx.textAlign='left';
  }
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);render();requestAnimationFrame(loop);
}

resizeGame();
resetGame();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
