const zeusSprites={idle:[],walk:[],crouch:[],attack:[[],[]]};
function loadZeusSprites(){
 const load=src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src;});
 const states=['idle','walk','attack_R','attack_L','crouch'];
 return Promise.all(states.map(name=>load(zeusSpriteData[name]))).then(imgs=>{
  const slice=(image,count)=>Array.from({length:8},(_,d)=>Array.from({length:count},(_,n)=>{
   const c=document.createElement('canvas');c.width=c.height=96;const g=c.getContext('2d');g.imageSmoothingEnabled=false;
   g.drawImage(image,n*96,d*96,96,96,0,0,96,96);return c;
  }));
  zeusSprites.idle=slice(imgs[0],1).map(a=>a[0]);zeusSprites.walk=slice(imgs[1],6);
  zeusSprites.attack=[slice(imgs[3],6),slice(imgs[2],6)];zeusSprites.crouch=slice(imgs[4],1).map(a=>a[0]);
 });
}

const attackInput={held:false,id:null};
function triggerAction(name){
 if(player.dead&&name!=='reset')return;
 if(name==='reset'){player.dead=false;player.action='';player.actionTimer=0;player.crouched=false;player.vx=player.vy=0;player.attackQueued=false;player.settleTimer=0;return;}
 if(name==='attack'){
  if(player.action==='attack'){player.attackQueued=true;return;}
  if(player.action==='hit')return;
  player.crouched=false;player.attackHeading=playerDirectionIndex();player.attackHand=1-player.attackHand;
  player.action='attack';player.actionTimer=ATTACK_DURATION;player.attackQueued=false;player.vx=player.vy=0;player.dir=(player.attackHeading-2)*Math.PI/4;return;
 }
 player.action=name;player.actionTimer=name==='hit'?.42:1.35;player.attackQueued=false;
 if(name==='death'){player.dead=true;player.crouched=false;player.vx=player.vy=0;attackInput.held=false;}
}

function controlLayout(){const k=clamp(Math.min(W,H)/520,.7,1.12),r=62*k,margin=24;return{r,stickX:r+margin,stickY:H-r-34,attackX:W-r-margin,attackY:H-r-36,crouchX:W-r-margin,crouchY:H-r*2.55-34,buttonR:r*.68};}

function resize(){
  const d=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.round(innerWidth*d); canvas.height=Math.round(innerHeight*d);
  W=Math.max(320,Math.round(innerWidth)); H=Math.max(180,Math.round(innerHeight));
  ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0); ctx.imageSmoothingEnabled=false;

}

function hash(x,y){ let n=(x*374761393+y*668265263)>>>0; n=(n^(n>>13))*1274126177>>>0; return (n^(n>>16))>>>0; }
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function iso(x,y){return {x:(x-y)*TW/2,y:(x+y)*TH/2};}
function worldToScreen(x,y){const p=iso(x,y);return{x:p.x-camera.x+W/2,y:p.y-camera.y+H/2};}
function tileVariant(x,y){const pool=[0,0,0,0,10,10,1,1,2,8,3,9,4,11,6,5,7];return pool[hash(x,y)%pool.length];}

function sandHash(x,y){let n=Math.imul(x,374761393)^Math.imul(y,668265263);n=Math.imul(n^(n>>>13),1274126177);return (n^(n>>>16))>>>0;}
function makeSandTile(tx,ty){
 const c=document.createElement('canvas');c.width=64;c.height=32;const g=c.getContext('2d'),im=g.createImageData(64,32);
 for(let y=0;y<32;y++)for(let x=0;x<64;x++){
  // Pixel-centred 2:1 diamond, no drawn tile borders.
  if(Math.abs((x+.5)-32)/32+Math.abs((y+.5)-16)/16>1)continue;
  const gx=(tx-ty)*32+x,gy=(tx+ty)*16+y;
  const h=sandHash(gx,gy),wave=Math.sin(gx*.025+gy*.055)*3+Math.sin(gx*.08-gy*.12)*1.5;
  let v=wave+((h%7)-3);if(h%137===0)v-=18;else if(h%97===0)v+=12;
  const i=(y*64+x)*4;im.data[i]=Math.round(194+v);im.data[i+1]=Math.round(159+v);im.data[i+2]=Math.round(103+v*.8);im.data[i+3]=255;
 }g.putImageData(im,0,0);return c;
}
const sandTileCache=new Map();

function buildMap(){
  tiles.length=0;
  for(let y=0;y<MAP_H;y++){
    const row=[];
    for(let x=0;x<MAP_W;x++) row.push(tileVariant(x,y));
    tiles.push(row);

}

function drawBaseDiamond(sx,sy){
  ctx.fillStyle='#c29f67';
  ctx.beginPath(); ctx.moveTo(sx+32,sy); ctx.lineTo(sx+64,sy+16); ctx.lineTo(sx+32,sy+32); ctx.lineTo(sx,sy+16); ctx.closePath(); ctx.fill();
}
function drawTile(tx,ty){
  const p=worldToScreen(tx,ty); const sx=Math.round(p.x),sy=Math.round(p.y);
  if(sx<-70||sx>W+70||sy<-40||sy>H+40)return;
  drawBaseDiamond(sx,sy);
  const key=tx+","+ty;let im=sandTileCache.get(key);if(!im){im=makeSandTile(tx,ty);sandTileCache.set(key,im);}
  if(im) ctx.drawImage(im,sx,sy,TW,TH);
  if(state.showGrid){
    ctx.strokeStyle='rgba(60,37,22,.22)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(sx+32.5,sy+.5); ctx.lineTo(sx+63.5,sy+16); ctx.lineTo(sx+32.5,sy+31.5); ctx.lineTo(sx+.5,sy+16); ctx.closePath(); ctx.stroke();
  }
}

function drawRangeMarkings(){
  // Central spawn pad and four navigation guides; sand remains the only terrain type.
  const c=worldToScreen(14.5,11.5);
  ctx.save(); ctx.translate(Math.round(c.x),Math.round(c.y+8));
  ctx.strokeStyle='rgba(86,72,47,.82)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(0,0,38,19,0,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='rgba(226,185,85,.82)'; ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-15,0);ctx.lineTo(15,0);ctx.moveTo(0,-8);ctx.lineTo(0,8);ctx.stroke();
  ctx.restore();

  // test-lane dashed lines
  const lanes=[[[5,7],[12,7]],[[16,15],[23,15]],[[8,16],[8,10]],[[20,11],[20,5]]];
  ctx.setLineDash([7,6]); ctx.lineWidth=2; ctx.strokeStyle='rgba(104,78,41,.55)';
  for(const [a,b] of lanes){const p1=worldToScreen(a[0]+.5,a[1]+.5),p2=worldToScreen(b[0]+.5,b[1]+.5);ctx.beginPath();ctx.moveTo(p1.x,p1.y+8);ctx.lineTo(p2.x,p2.y+8);ctx.stroke();}
  ctx.setLineDash([]);
}

function pixelLine(c,x0,y0,x1,y1,color){
 x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
 c.fillStyle=color;let dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1,err=dx+dy;
 for(;;){c.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e=err*2;if(e>=dy){err+=dy;x0+=sx;}if(e<=dx){err+=dx;y0+=sy;}}
}

 const base=sign===1?40:72,h=36;
 // Chain-link diamonds, clipped to each panel in its own plane.
 for(let u=0;u<64;u++)for(let z=2;z<h-1;z++){
  if((u+z)%12===0||(u-z+120)%12===0){g.fillStyle=(u+z)%12===0?'#6b7776':'#3c494b';g.fillRect(u+2,base+sign*Math.floor(u/2)-z,1,1);}
 }
 for(const z of [2,h]){pixelLine(g,2,base-z,66,base+sign*32-z,'#263237');pixelLine(g,2,base-z-1,66,base+sign*32-z-1,'#88918a');}
 for(const u of [0,64]){const y=base+sign*u/2;g.fillStyle='#29363c';g.fillRect(u+1,y-h-2,4,h+5);g.fillStyle='#8b9692';g.fillRect(u+1,y-h-2,1,h+3);g.fillStyle='#c8a25d';g.fillRect(u,y-h-3,6,3);}

  const x=Math.round(p.x+(f.sign===1?32:-32))-2,y=Math.round(p.y+16)-(f.sign===1?40:72);
  if(x>-75&&x<W+75&&y>-75&&y<H+75)ctx.drawImage(im,x,y);
 }
}

function playerDirectionIndex(){
  // Sprite columns are N, NE, E, SE, S, SW, W, NW; dir uses screen-space radians.
  const oct=((Math.round(player.dir/(Math.PI/4))%8)+8)%8;
  if(player.heading===undefined)player.heading=oct;
  const delta=Math.atan2(Math.sin(player.dir-player.heading*Math.PI/4),Math.cos(player.dir-player.heading*Math.PI/4));
  if(Math.abs(delta)>Math.PI/8+.07)player.heading=oct;
  return [2,3,4,5,6,7,0,1][player.heading];
}
function drawRobot(){
 const p=worldToScreen(player.x,player.y),x=Math.round(p.x),ground=Math.round(p.y+8);
 ctx.fillStyle='rgba(20,16,12,.34)';ctx.beginPath();ctx.ellipse(x,ground,19*(player.crouched?.9:1),7,0,0,Math.PI*2);ctx.fill();
 if(!zeusSprites.idle.length)return;
 const d=player.action==='attack'?player.attackHeading:playerDirectionIndex();
 let frame=zeusSprites.idle[d],dx=0,dy=0,rot=0,alpha=1;
 if(player.action==='death'){
  const t=clamp(1-player.actionTimer/1.35,0,1);rot=t*1.35;dy=t*5;alpha=1-t*.62;
 }else if(player.action==='hit'){dx=Math.floor(state.time*24)%2?2:-2;
 }else if(player.action==='attack'){
  const t=clamp(1-player.actionTimer/ATTACK_DURATION,0,1),thresholds=[.08,.24,.39,.57,.84];
  let n=0;while(n<thresholds.length&&t>thresholds[n])n++;
  frame=zeusSprites.attack[player.attackHand][d][n];
 }else if(player.crouched){frame=zeusSprites.crouch[d];
 }else if(player.moving&&Math.hypot(player.vx,player.vy)>.18){
  frame=zeusSprites.walk[d][Math.floor(player.walk/WALK_STRIDE*6)%6];
 }else if(player.settleTimer>0){frame=zeusSprites.walk[d][player.landingFrame||0];}
 ctx.save();ctx.globalAlpha=alpha;ctx.translate(x+Math.round(dx),ground+Math.round(dy));
 if(player.action==='death')ctx.rotate(rot);
 if(player.action==='hit')ctx.filter=Math.floor(state.time*24)%2?'brightness(1.7) saturate(.7)':'none';
 ctx.drawImage(frame,-48,-82,96,96);ctx.restore();
}

function update(dt){
 if(!state.started)return;state.time+=dt;
 if(player.actionTimer>0){
  player.actionTimer=Math.max(0,player.actionTimer-dt);
  if(player.actionTimer===0&&player.action!=='death'){
   const repeat=player.action==='attack'&&(attackInput.held||keys.has('Space')||player.attackQueued);player.action='';
   if(repeat)triggerAction('attack');
  }
 }
 if(player.dead){player.moving=false;return;}
 let sx=0,sy=0;
 if(keys.has('ArrowLeft')||keys.has('KeyA'))sx-=1;if(keys.has('ArrowRight')||keys.has('KeyD'))sx+=1;
 if(keys.has('ArrowUp')||keys.has('KeyW'))sy-=1;if(keys.has('ArrowDown')||keys.has('KeyS'))sy+=1;
 if(leftStick.active){sx+=leftStick.dx;sy+=leftStick.dy;}
 const len=Math.hypot(sx,sy),mag=len>.08?Math.min(1,len):0;
 let tx=0,ty=0;
 if(mag){sx/=len;sy/=len;let wx=(sx+2*sy)*.5,wy=(-sx+2*sy)*.5;const wl=Math.hypot(wx,wy)||1;
  const speed=player.speed*mag*(player.crouched?.48:1)*(player.action==='attack'?0:player.action==='hit'?.15:1);tx=wx/wl*speed;ty=wy/wl*speed;
  if(player.action!=='attack'){
   const desired=Math.atan2(sy,sx),diff=Math.atan2(Math.sin(desired-player.dir),Math.cos(desired-player.dir));
   player.dir+=clamp(diff,-dt*9,dt*9);
  }
 }
 // Bounded acceleration and braking: heavy, responsive, independent of frame rate.
 const delta=Math.hypot(tx-player.vx,ty-player.vy),limit=(mag?13:22)*dt;
 if(delta<=limit){player.vx=tx;player.vy=ty;}else{player.vx+=(tx-player.vx)/delta*limit;player.vy+=(ty-player.vy)/delta*limit;}
 const oldX=player.x,oldY=player.y;
 player.x=clamp(player.x+player.vx*dt,1.2,MAP_W-1.2);player.y=clamp(player.y+player.vy*dt,1.2,MAP_H-1.2);
 if(player.x===oldX)player.vx=0;if(player.y===oldY)player.vy=0;
 const wasMoving=player.moving,distance=Math.hypot(player.x-oldX,player.y-oldY);player.moving=distance>.00001;player.walk+=distance;
 if(wasMoving&&!player.moving&&!player.action){player.settleTimer=.09;player.landingFrame=(player.walk/WALK_STRIDE%1)<.5?0:3;}
 if(player.settleTimer>0)player.settleTimer=Math.max(0,player.settleTimer-dt);
 const ip=iso(player.x,player.y),follow=1-Math.exp(-dt*9);
 camera.x+=(ip.x-camera.x)*follow;camera.y+=(ip.y-camera.y)*follow;
}

function drawHUD(){
  ctx.fillStyle='rgba(12,14,15,.76)';ctx.fillRect(8,8,207,46);
  ctx.strokeStyle='rgba(225,190,124,.38)';ctx.strokeRect(8.5,8.5,206,45);
  ctx.fillStyle='#f0dfbf';ctx.font='bold 11px monospace';ctx.fillText('ЗЕВС01 • ПОЛИГОН 2:1',16,25);
  ctx.fillStyle='#c6b28f';ctx.font='9px monospace';ctx.fillText('6 кадров шага • удары двумя руками',16,40);
  ctx.fillStyle='#ad9b7c';ctx.font='8px monospace';ctx.fillText('v0.9.14',W-45,16);
  if(state.showHelp&&!touchMode){
    const w=Math.min(290,W-24),x=(W-w)/2;
    ctx.fillStyle='rgba(10,12,13,.82)';ctx.fillRect(x,H-47,w,39);
    ctx.fillStyle='#dfd4bd';ctx.textAlign='center';ctx.font='7px monospace';
    ctx.fillText('WASD / стрелки — ходьба   Пробел — удары',W/2,H-32);
    ctx.fillText('C — присесть   T — попадание   V — падение   R — сброс',W/2,H-19);ctx.textAlign='left';
  }
}
function drawStick(){
  if(!touchMode||!state.started)return;
  const l=controlLayout(),bx=l.stickX,by=l.stickY,r=l.r;
  ctx.save();ctx.globalAlpha=.72;
  ctx.fillStyle='rgba(12,16,20,.48)';ctx.beginPath();ctx.arc(bx,by,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(238,232,218,.78)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(bx,by,r,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='rgba(238,232,218,.28)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(bx,by,r*.53,0,Math.PI*2);ctx.stroke();
  const nx=bx+leftStick.dx*r*.62,ny=by+leftStick.dy*r*.62;
  ctx.fillStyle='rgba(228,220,203,.72)';ctx.beginPath();ctx.arc(nx,ny,r*.27,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.88)';ctx.lineWidth=2;ctx.stroke();
  const drawButton=(x,y,txt,active)=>{ctx.fillStyle=active?'rgba(197,132,61,.82)':'rgba(18,22,27,.72)';ctx.beginPath();ctx.arc(x,y,l.buttonR,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,239,208,.86)';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff4df';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x,y);};
  drawButton(l.attackX,l.attackY,'УДАР',player.action==='attack');drawButton(l.crouchX,l.crouchY,'C',player.crouched);
  ctx.restore();ctx.textAlign='left';ctx.textBaseline='alphabetic';
}

function drawStart(){
  ctx.fillStyle='rgba(8,9,10,.72)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.fillStyle='#f0dfbf';ctx.font='bold 20px monospace';ctx.fillText('ROBOT ARENA',W/2,H/2-40);
  ctx.fillStyle='#c89b56';ctx.font='10px monospace';ctx.fillText('ТЕСТОВЫЙ ПОЛИГОН • v0.9.14',W/2,H/2-20);
  ctx.fillStyle='#1e2423';ctx.fillRect(W/2-78,H/2+4,156,34);ctx.strokeStyle='#9b8b6b';ctx.strokeRect(W/2-77.5,H/2+4.5,155,33);
  ctx.fillStyle='#f4ead6';ctx.font='bold 11px monospace';ctx.fillText('ВОЙТИ НА ПОЛИГОН',W/2,H/2+25);ctx.textAlign='left';
}

function draw(){
  ctx.fillStyle='#17191b';ctx.fillRect(0,0,W,H);
  ctx.save();const zoom=2;ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.translate(-W/2,-H/2);
  // Painter's order is essential for isometric ground.
  for(let sum=0;sum<MAP_W+MAP_H-1;sum++){
    for(let y=0;y<MAP_H;y++){
      const x=sum-y;if(x>=0&&x<MAP_W)drawTile(x,y);
    }
  }
  drawRangeMarkings();drawBoundaryPosts(false);drawRobot();drawBoundaryPosts(true);ctx.restore();drawHUD();drawStick();
  if(!state.started)drawStart();
}

addEventListener('keydown',e=>{
  keys.add(e.code);
  if(e.code==='KeyG'&&!e.repeat)state.showGrid=!state.showGrid;
  if(e.code==='KeyH'&&!e.repeat)state.showHelp=!state.showHelp;
  if(!state.started&&(e.code==='Enter'||e.code==='Space'))state.started=true;
  if(state.started&&!e.repeat){
    if(e.code==='Space'&&!e.repeat)triggerAction('attack');
    if(e.code==='KeyC'&&!e.repeat&&player.action!=='attack')player.crouched=!player.crouched;
    if(e.code==='KeyT')triggerAction('hit');
    if(e.code==='KeyV')triggerAction('death');
    if(e.code==='KeyR')triggerAction('reset');
  }
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
},{passive:false});
addEventListener('keyup',e=>keys.delete(e.code));

canvas.addEventListener('pointerdown',e=>{
  if(!state.started){state.started=true;return;}
  if(!touchMode)return;
  const x=e.clientX,y=e.clientY,l=controlLayout();
  const dist=(ax,ay)=>Math.hypot(x-ax,y-ay);
  if(dist(l.crouchX,l.crouchY)<l.buttonR*1.08){if(player.action!=='attack')player.crouched=!player.crouched;return;}
  if(dist(l.attackX,l.attackY)<l.buttonR*1.08){if(!attackInput.held){attackInput.held=true;attackInput.id=e.pointerId;canvas.setPointerCapture(e.pointerId);triggerAction('attack');}return;}
  if(x<W*.52&&y>H*.42&&!leftStick.active){leftStick.active=true;leftStick.id=e.pointerId;leftStick.dx=leftStick.dy=0;canvas.setPointerCapture(e.pointerId);updateStick(e);return;}
  
});
function updateStick(e){
  if(leftStick.active&&e.pointerId===leftStick.id){
    const l=controlLayout(),dx=e.clientX-l.stickX,dy=e.clientY-l.stickY,dist=Math.hypot(dx,dy),dead=10;
    if(dist<=dead){leftStick.dx=leftStick.dy=0;return;}
    const mag=clamp((dist-dead)/(l.r-dead),0,1);leftStick.dx=dx/dist*mag;leftStick.dy=dy/dist*mag;
  }
}
canvas.addEventListener('pointermove',updateStick);
function endPointer(e){if(e.pointerId===attackInput.id){attackInput.held=false;attackInput.id=null;}if(leftStick.active&&e.pointerId===leftStick.id){leftStick.active=false;leftStick.id=null;leftStick.dx=leftStick.dy=0;}}
canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);canvas.addEventListener('lostpointercapture',endPointer);
function releaseInputs(){attackInput.held=false;attackInput.id=null;player.attackQueued=false;keys.clear();leftStick.active=false;leftStick.id=null;leftStick.dx=leftStick.dy=0;}
addEventListener('blur',releaseInputs);document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseInputs();});

let last=performance.now();
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop);} 
loadImages().catch(err=>console.error('Sand tile load error',err));
loadZeusSprites().catch(err=>console.error('Zeus01 sprite load error',err));
const c=iso(player.x,player.y);camera.x=c.x;camera.y=c.y;requestAnimationFrame(loop);
})();
</script>
