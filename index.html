function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function rand(a,b){ return a + Math.random() * (b-a); }
function d2(ax,ay,bx,by){ const dx=ax-bx, dy=ay-by; return dx*dx + dy*dy; }
function hash(x,y){ let n = x * 374761393 + y * 668265263; n = (n ^ (n >> 13)) * 1274126177; n = n ^ (n >> 16); return Math.abs(n); }
function worldToScreen(x,y){ return {x:x-camera.x,y:y-camera.y}; }
function screenToWorld(x,y){ return {x:x+camera.x,y:y+camera.y}; }
function resizeGame(){ const portrait=innerHeight>innerWidth; W=portrait?270:480; H=portrait?480:270; canvas.width=W; canvas.height=H; leftStick.sx=52; leftStick.sy=H-48; rightStick.sx=W-52; rightStick.sy=H-48; }
addEventListener('resize', resizeGame);

function preloadAssets(){
  const jobs = Object.entries(assets).map(([name, meta]) => new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      sheetImages[name] = img;
      const cellW = img.width / meta.cols, cellH = img.height / meta.rows;
      tileRects[name] = [];
      for(let r=0;r<meta.rows;r++) for(let c=0;c<meta.cols;c++) tileRects[name].push({sx:c*cellW+meta.margin, sy:r*cellH+meta.margin, sw:cellW-meta.margin*2, sh:cellH-meta.margin*2});
      resolve();
    };
    img.src = meta.src;
  }));
  return Promise.all(jobs).then(()=>state.loaded=true);
}
function drawTileFromSheet(sheet,index,dx,dy,dw=TILE,dh=TILE){
  const img=sheetImages[sheet], rect=tileRects[sheet]&&tileRects[sheet][index];
  if(!img||!rect) return;
  ctx.drawImage(img, rect.sx, rect.sy, rect.sw, rect.sh, Math.round(dx), Math.round(dy), Math.round(dw), Math.round(dh));
}
function makeTile(base='grass'){ return {base,variant:0,pathShape:null,waterShape:null,cliffShape:null}; }
function tileAt(tx,ty){ if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) return null; return terrain[ty][tx]; }
function setBase(tx,ty,base){ if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) return; terrain[ty][tx].base=base; }
function paintRectTiles(tx,ty,tw,th,base){ for(let y=ty;y<ty+th;y++) for(let x=tx;x<tx+tw;x++) setBase(x,y,base); }
function paintEllipse(cx,cy,rx,ry,base){ for(let y=Math.floor(cy-ry-1);y<=Math.ceil(cy+ry+1);y++) for(let x=Math.floor(cx-rx-1);x<=Math.ceil(cx+rx+1);x++){ const dx=(x-cx)/rx, dy=(y-cy)/ry; if(dx*dx+dy*dy<=1) setBase(x,y,base);} }
function paintPath(points,halfWidth=0){
  for(let i=0;i<points.length-1;i++){
    const [x1,y1]=points[i], [x2,y2]=points[i+1];
    if(x1===x2){ for(let y=Math.min(y1,y2);y<=Math.max(y1,y2);y++) for(let x=x1-halfWidth;x<=x1+halfWidth;x++){ const t=tileAt(x,y); if(t&&t.base!=='water') t.base='path'; } }
    else if(y1===y2){ for(let x=Math.min(x1,x2);x<=Math.max(x1,x2);x++) for(let y=y1-halfWidth;y<=y1+halfWidth;y++){ const t=tileAt(x,y); if(t&&t.base!=='water') t.base='path'; } }
  }
}
function addDecor(type,x,y,extra={}){ decorObjects.push({type,x,y,...extra}); }
function addWall(x,y,w,h,kind='block'){ walls.push({x,y,w,h,kind}); }
function addFenceHorizontal(tx,ty,count){ for(let i=0;i<count;i++) addDecor('fenceH',(tx+i)*TILE,ty*TILE,{v:i}); addWall(tx*TILE+2,ty*TILE+9,count*TILE-4,12,'fence'); }
function addFenceVertical(tx,ty,count){ for(let i=0;i<count;i++) addDecor('fenceV',tx*TILE,(ty+i)*TILE,{v:i}); addWall(tx*TILE+9,ty*TILE+2,12,count*TILE-4,'fence'); }
function addHouse(tx,ty,kind=0){ addDecor('house',tx*TILE+TILE,ty*TILE+TILE*2,{kind}); addWall(tx*TILE+12,ty*TILE+28,TILE*2-24,TILE*2-30,'house'); }
function addBarn(tx,ty){ addDecor('barn',tx*TILE+TILE,ty*TILE+TILE*2,{}); addWall(tx*TILE+12,ty*TILE+28,TILE*2-24,TILE*2-28,'barn'); }
function addBridge(tx,ty,len,vertical=false){ if(!vertical){ for(let i=0;i<len;i++) bridgeSet.add(`${tx+i},${ty}`); addDecor('bridgeH',tx*TILE,ty*TILE,{len}); } else { for(let i=0;i<len;i++) bridgeSet.add(`${tx},${ty+i}`); addDecor('bridgeV',tx*TILE,ty*TILE,{len}); } }
function isWaterTile(tx,ty){ const t=tileAt(tx,ty); return t&&t.base==='water'; }
function isPathTile(tx,ty){ const t=tileAt(tx,ty); return t&&t.base==='path'; }
function isCliffTile(tx,ty){ const t=tileAt(tx,ty); return t&&t.base==='cliff'; }
function isBridge(tx,ty){ return bridgeSet.has(`${tx},${ty}`); }
function finalizeTerrain(){
  for(let y=0;y<MAP_H;y++) for(let x=0;x<MAP_W;x++){
    const t=terrain[y][x]; t.variant=hash(x,y)%16;
    if(t.base==='path'){
      const n=isPathTile(x,y-1),s=isPathTile(x,y+1),w=isPathTile(x-1,y),e=isPathTile(x+1,y);
      if(n&&s&&e&&w) t.pathShape='cross';
      else if(n&&s&&e) t.pathShape='teeE';
      else if(n&&s&&w) t.pathShape='teeW';
      else if(e&&w&&n) t.pathShape='teeN';
      else if(e&&w&&s) t.pathShape='teeS';
      else if(n&&s) t.pathShape='v';
      else if(e&&w) t.pathShape='h';
      else if(s&&e) t.pathShape='se';
      else if(s&&w) t.pathShape='sw';
      else if(n&&e) t.pathShape='ne';
      else if(n&&w) t.pathShape='nw';
      else if(n||s) t.pathShape='v';
      else if(e||w) t.pathShape='h';
      else t.pathShape='patch';
    }
    if(t.base==='water'){
      const n=isWaterTile(x,y-1),s=isWaterTile(x,y+1),w=isWaterTile(x-1,y),e=isWaterTile(x+1,y);
      if(n&&s&&e&&w) t.waterShape='center';
      else if(!n&&s&&e&&w) t.waterShape='north';
      else if(!s&&n&&e&&w) t.waterShape='south';
      else if(!w&&n&&s&&e) t.waterShape='west';
      else if(!e&&n&&s&&w) t.waterShape='east';
      else t.waterShape='center';
    }
    if(t.base==='cliff'){
      const above=isCliffTile(x,y-1),below=isCliffTile(x,y+1),w=isCliffTile(x-1,y),e=isCliffTile(x+1,y);
      if(!above){ if(!w&&e) t.cliffShape='topL'; else if(!e&&w) t.cliffShape='topR'; else t.cliffShape='top'; }
      else if(!below) t.cliffShape='foot';
      else t.cliffShape='wall';
    }
  }
}

  const minTX=Math.max(0,Math.floor(camera.x/TILE)-1), minTY=Math.max(0,Math.floor(camera.y/TILE)-1), maxTX=Math.min(MAP_W-1,Math.ceil((camera.x+W)/TILE)+1), maxTY=Math.min(MAP_H-1,Math.ceil((camera.y+H)/TILE)+1);
  for(let ty=minTY;ty<=maxTY;ty++) for(let tx=minTX;tx<=maxTX;tx++) drawGroundTile(tx,ty);
  for(const obj of decorObjects){ if(obj.type==='bridgeH'||obj.type==='bridgeV') continue; if(obj.x<camera.x-80||obj.x>camera.x+W+80||obj.y<camera.y-80||obj.y>camera.y+H+80) continue; if(['bush','stump','reed','rock','fenceH','fenceV','fenceGateH','barrels','crate','crateStack','crateBarrel','lantern','sign','signArrow','board'].includes(obj.type)) drawDecorObject(obj); }
  for(const obj of decorObjects) if(obj.type==='bridgeH'||obj.type==='bridgeV') drawDecorObject(obj);
  for(const obj of decorObjects){ if(obj.x<camera.x-100||obj.x>camera.x+W+100||obj.y<camera.y-120||obj.y>camera.y+H+120) continue; if(obj.type==='tree'||obj.type==='house'||obj.type==='barn') drawDecorObject(obj); }
  for(const o of outposts) if(o.x>=camera.x-30&&o.x<=camera.x+W+30&&o.y>=camera.y-30&&o.y<=camera.y+H+30) drawOutpost(o);
  for(const s of scraps){ const p=worldToScreen(s.x,s.y); ctx.fillStyle='#d7b35b'; ctx.fillRect(p.x-4,p.y-3,8,6); ctx.fillStyle='#f6dc7e'; ctx.fillRect(p.x-5,p.y-6,10,3); ctx.fillStyle='#9c7c3a'; ctx.fillRect(p.x-4,p.y+1,8,2); }
  for(const b of bullets){ const p=worldToScreen(b.x,b.y); ctx.fillStyle='#d8f4ff'; ctx.fillRect(p.x-2,p.y-1,5,2); }
  for(const b of enemyBullets){ const p=worldToScreen(b.x,b.y); ctx.fillStyle='#ff8c69'; ctx.fillRect(p.x-2,p.y-2,4,4); }
  for(const e of enemies){ if(e.x<camera.x-20||e.x>camera.x+W+20||e.y<camera.y-20||e.y>camera.y+H+20) continue; drawRobotWorld(e.x,e.y,e.angle,e.angle,true,e.hitFlash>0); const p=worldToScreen(e.x,e.y); ctx.fillStyle='#190d0e'; ctx.fillRect(p.x-10,p.y-15,20,3); ctx.fillStyle='#c84f54'; ctx.fillRect(p.x-10,p.y-15,20*(e.hp/e.maxHp),3); }
  if(!state.gameOver) drawRobotWorld(player.x,player.y,player.bodyAngle,player.turretAngle,false,false);
  for(const p of particles){ const s=worldToScreen(p.x,p.y); if(s.x<-10||s.x>W+10||s.y<-10||s.y>H+10) continue; const a=clamp(p.life/p.maxLife,0,1); ctx.globalAlpha=a; if(p.type==='smoke'){ ctx.fillStyle='#596470'; ctx.fillRect(s.x-2,s.y-2,5,5); } else if(p.type==='spawn'){ ctx.fillStyle='#e74d62'; ctx.fillRect(s.x-2,s.y-2,4,4); } else if(p.type==='muzzle'){ ctx.fillStyle='#fff0a7'; ctx.fillRect(s.x-2,s.y-1,4,2); } else { ctx.fillStyle='#ffd16a'; ctx.fillRect(s.x,s.y,2,2); } } ctx.globalAlpha=1;
}
function drawHUD(){
  ctx.fillStyle='#06080b'; ctx.fillRect(7,7,104,12); ctx.fillStyle='#242b31'; ctx.fillRect(9,9,100,8); ctx.fillStyle=player.hp>35?'#58a968':'#ba5151'; ctx.fillRect(9,9,100*(player.hp/player.maxHp),8);
  ctx.fillStyle='#f0f2f2'; ctx.font='10px monospace'; ctx.fillText(`HP ${Math.ceil(player.hp)}/${player.maxHp}`,11,18); ctx.fillText(`УР. ${state.level}`,7,33); ctx.fillText(`УНИЧТОЖЕНО: ${state.kills}`,7,46);
  const barW=Math.min(125,W-14); ctx.fillStyle='#111519'; ctx.fillRect(7,54,barW,7); ctx.fillStyle='#d7b15e'; ctx.fillRect(8,55,(barW-2)*(state.xp/state.xpNeed),5); ctx.fillStyle='#e0d1a1'; ctx.fillText(`ДЕТАЛИ ${state.xp}/${state.xpNeed}`,7,72); ctx.fillStyle='#d9e0d3'; ctx.fillText('v0.9.2',W-38,14);
}
function drawMiniMap(){
  const mw=64,mh=44,x=W-mw-7,y=24; ctx.globalAlpha=.88; ctx.fillStyle='#17261a'; ctx.fillRect(x,y,mw,mh); ctx.strokeStyle='#d5dbc9'; ctx.lineWidth=1; ctx.strokeRect(x+.5,y+.5,mw-1,mh-1);
  for(let ty=0;ty<MAP_H;ty++) for(let tx=0;tx<MAP_W;tx++){ const t=tileAt(tx,ty); if(!t) continue; let c='#355c35'; if(t.base==='water') c='#3497c9'; else if(t.base==='path') c='#bf8f57'; else if(t.base==='cliff') c='#886541'; ctx.fillStyle=c; ctx.fillRect(x+tx/MAP_W*mw,y+ty/MAP_H*mh,Math.max(2,mw/MAP_W),Math.max(2,mh/MAP_H)); }
  for(const o of outposts){ ctx.fillStyle='#d25454'; ctx.fillRect(x+(o.x/WORLD_W)*mw-1,y+(o.y/WORLD_H)*mh-1,3,3); } ctx.fillStyle='#8fd9ef'; ctx.fillRect(x+(player.x/WORLD_W)*mw-1,y+(player.y/WORLD_H)*mh-1,3,3); ctx.globalAlpha=1;
}
function drawStick(s,dx,dy,label){ const bx=s.active?s.sx:dx, by=s.active?s.sy:dy, kx=bx+s.dx*28, ky=by+s.dy*28; ctx.globalAlpha=.28; ctx.strokeStyle='#eef0ea'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(bx,by,28,0,Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.arc(kx,ky,11,0,Math.PI*2); ctx.stroke(); ctx.fillStyle='#eef0ea'; ctx.font='8px monospace'; ctx.textAlign='center'; ctx.fillText(label,bx,by+42); ctx.textAlign='left'; ctx.globalAlpha=1; }
function drawTouchControls(){ if(navigator.maxTouchPoints<=0) return; drawStick(leftStick,52,H-48,'ДВИЖЕНИЕ'); drawStick(rightStick,W-52,H-48,'ОГОНЬ'); }
function getUpgradeCards(){ const gap=7; if(H>W){ const w=W-28,h=74,x=14; return [{x:x,y:H/2-120,w:w,h:h},{x:x,y:H/2-39,w:w,h:h},{x:x,y:H/2+42,w:w,h:h}]; } const w=138,h=92,total=w*3+gap*2,sx=(W-total)/2; return [{x:sx,y:H/2-46,w:w,h:h},{x:sx+w+gap,y:H/2-46,w:w,h:h},{x:sx+(w+gap)*2,y:H/2-46,w:w,h:h}]; }
function drawUpgrade(){ ctx.fillStyle='rgba(4,6,5,.88)'; ctx.fillRect(0,0,W,H); ctx.fillStyle='#f4f6f2'; ctx.font='bold 15px monospace'; ctx.textAlign='center'; ctx.fillText(`УРОВЕНЬ ${state.level}`,W/2,H>W?H/2-153:48); ctx.font='10px monospace'; ctx.fillStyle='#aab4a8'; ctx.fillText('ВЫБЕРИ УЛУЧШЕНИЕ',W/2,H>W?H/2-136:63); const cards=getUpgradeCards(); cards.forEach((c,i)=>{ ctx.fillStyle='#1b2520'; ctx.fillRect(c.x,c.y,c.w,c.h); ctx.fillStyle='#819082'; ctx.fillRect(c.x,c.y,c.w,3); ctx.fillStyle='#304139'; ctx.fillRect(c.x+5,c.y+5,19,19); ctx.fillStyle='#eef1eb'; ctx.font='bold 9px monospace'; ctx.textAlign='left'; ctx.fillText(`${i+1}. ${upgrades[i].name}`,c.x+9,c.y+34); ctx.fillStyle='#d2ba6c'; ctx.font='9px monospace'; ctx.fillText(upgrades[i].desc,c.x+9,c.y+51); }); ctx.textAlign='left'; }
function render(){
  if(!state.loaded){ ctx.fillStyle='#102017'; ctx.fillRect(0,0,W,H); ctx.fillStyle='#e8eee8'; ctx.font='14px monospace'; ctx.textAlign='center'; ctx.fillText('ЗАГРУЗКА КАРТЫ...',W/2,H/2); ctx.textAlign='left'; return; }
  ctx.save(); let ox=0,oy=0; if(state.shake>0){ ox=rand(-state.shake,state.shake); oy=rand(-state.shake,state.shake); } ctx.translate(Math.round(ox),Math.round(oy)); drawWorld(); ctx.restore();
  drawHUD(); drawMiniMap(); drawTouchControls(); if(state.pausedForUpgrade) drawUpgrade();
  if(state.gameOver){ ctx.fillStyle='rgba(0,0,0,.78)'; ctx.fillRect(0,0,W,H); ctx.fillStyle='#f4f5f3'; ctx.font='bold 19px monospace'; ctx.textAlign='center'; ctx.fillText('РОБОТ УНИЧТОЖЕН',W/2,H/2-25); ctx.font='10px monospace'; ctx.fillStyle='#bec7bd'; ctx.fillText(`Счёт ${state.score}   Врагов ${state.kills}   Уровень ${state.level}`,W/2,H/2); ctx.fillText('Коснись экрана для новой игры',W/2,H/2+22); ctx.textAlign='left'; }
}
let last=performance.now();
function loop(now){ const dt=Math.min(.033,(now-last)/1000); last=now; update(dt); render(); requestAnimationFrame(loop); }
resizeGame(); buildMap(); preloadAssets().then(()=>{ resetGame(); requestAnimationFrame(loop); });
})();
</script>
