<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Robot Arena v0.6</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a1014;
    touch-action: none;
    overscroll-behavior: none;
    font-family: monospace;
  }
  body { display: grid; place-items: center; }
  canvas {
    display: block;
    width: 100vw;
    height: 100dvh;
    background: #132016;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;

let W = 480, H = 270;
const TILE = 32;
const MAP_W = 60;
const MAP_H = 40;
const WORLD_W = MAP_W * TILE;
const WORLD_H = MAP_H * TILE;

const keys = new Set();
let mouseX = 240, mouseY = 135, mouseDown = false;

const bullets = [];
const enemyBullets = [];
const enemies = [];
const particles = [];
const scraps = [];

const state = {
  score: 0,
  kills: 0,
  time: 0,
  shake: 0,
  gameOver: false,
  pausedForUpgrade: false,
  level: 1,
  xp: 0,
  xpNeed: 5
};

const player = {
  x: 7.5 * TILE,
  y: 31.5 * TILE,
  r: 9,
  hp: 100,
  maxHp: 100,
  speed: 92,
  damage: 15,
  fireRate: 7.5,
  bulletSpeed: 240,
  fireCooldown: 0,
  bodyAngle: 0,
  turretAngle: 0
};

const camera = { x: 0, y: 0 };

const leftStick = { active: false, id: null, sx: 55, sy: 220, dx: 0, dy: 0 };
const rightStick = { active: false, id: null, sx: 425, sy: 220, dx: 0, dy: 0 };

const upgradeChoices = [
  { name: 'УСИЛЕННЫЕ СНАРЯДЫ', desc: '+25% урона', apply(){ player.damage *= 1.25; } },
  { name: 'УСКОРЕННЫЙ ЗАТВОР', desc: '+20% скорострельности', apply(){ player.fireRate *= 1.20; } },
  { name: 'УСИЛЕННАЯ БРОНЯ', desc: '+20 HP и лечение', apply(){ player.maxHp += 20; player.hp = Math.min(player.maxHp, player.hp + 35); } }
];

function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function rand(a, b){ return a + Math.random() * (b - a); }
function irand(a, b){ return Math.floor(rand(a, b + 1)); }
function d2(ax, ay, bx, by){ const dx = ax - bx, dy = ay - by; return dx*dx + dy*dy; }

const terrain = [];
const decorObjects = [];
const walls = [];
const outposts = [];

function makeTile(base='grass', variant=0){
  return { base, variant, overlay: null };
}

function initTerrain(){
  for (let y = 0; y < MAP_H; y++) {
    terrain[y] = [];
    for (let x = 0; x < MAP_W; x++) {
      terrain[y][x] = makeTile('grass', (x * 17 + y * 31) % 3);
    }
  }

  // Gentle path route through the map.
  const pathPoints = [
    [5, 33], [13, 33], [13, 29], [20, 29], [20, 23], [29, 23],
    [29, 18], [37, 18], [37, 12], [49, 12], [49, 8], [54, 8]
  ];
  for (let i = 0; i < pathPoints.length - 1; i++) paintPathSegment(pathPoints[i], pathPoints[i+1], 1);

  // Side path to southeast.
  const sidePath = [[34, 30], [45, 30], [45, 34], [53, 34]];
  for (let i = 0; i < sidePath.length - 1; i++) paintPathSegment(sidePath[i], sidePath[i+1], 1);

  // Stream with meanders.
  paintWaterRect(41, 0, 2, 7);
  paintWaterRect(39, 6, 4, 2);
  paintWaterRect(39, 7, 2, 6);
  paintWaterRect(37, 12, 4, 2);
  paintWaterRect(37, 13, 2, 7);
  paintWaterRect(35, 19, 4, 2);
  paintWaterRect(35, 20, 2, 6);
  paintWaterRect(33, 25, 4, 2);
  paintWaterRect(33, 26, 2, 7);

  // Bridge crossing.
  paintBridgeRect(32, 28, 6, 2);

  // Ponds.
  paintEllipse(14, 8, 3, 2, 'water');
  paintEllipse(29, 32, 3, 2, 'water');

  // Fields.
  paintRectTiles(3, 33, 8, 5, 'field');
  paintRectTiles(8, 5, 8, 5, 'field');
  paintRectTiles(25, 32, 5, 4, 'field');
  paintRectTiles(46, 31, 9, 5, 'field');

  // Cliff plateaus.
  paintRectTiles(35, 4, 10, 4, 'cliff');
  paintRectTiles(31, 15, 8, 4, 'cliff');
  paintRectTiles(21, 6, 6, 3, 'cliff');
  paintRectTiles(8, 17, 7, 3, 'cliff');
  paintRectTiles(45, 18, 7, 4, 'cliff');
}

function tileAt(tx, ty){
  if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return null;
  return terrain[ty][tx];
}

function setBase(tx, ty, base){
  if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return;
  terrain[ty][tx].base = base;
}

function paintRectTiles(tx, ty, tw, th, base){
  for (let y = ty; y < ty + th; y++) {
    for (let x = tx; x < tx + tw; x++) setBase(x, y, base);
  }
}

function paintWaterRect(tx, ty, tw, th){
  paintRectTiles(tx, ty, tw, th, 'water');
}

function paintBridgeRect(tx, ty, tw, th){
  for (let y = ty; y < ty + th; y++) {
    for (let x = tx; x < tx + tw; x++) {
      if (tileAt(x, y)) terrain[y][x].overlay = 'bridge';
    }
  }
}

function paintEllipse(cx, cy, rx, ry, base){
  for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y++) {
    for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx + 1); x++) {
      const dx = (x - cx) / rx;
      const dy = (y - cy) / ry;
      if (dx*dx + dy*dy <= 1) setBase(x, y, base);
    }
  }
}

function paintPathSegment(a, b, halfWidth){
  const [x1, y1] = a;
  const [x2, y2] = b;
  if (x1 === x2) {
    const minY = Math.min(y1, y2), maxY = Math.max(y1, y2);
    for (let y = minY; y <= maxY; y++) {
      for (let x = x1 - halfWidth; x <= x1 + halfWidth; x++) {
        if (tileAt(x, y) && tileAt(x, y).base === 'grass') setBase(x, y, 'path');
        else if (tileAt(x, y) && tileAt(x, y).base === 'field') setBase(x, y, 'path');
      }
    }
  } else if (y1 === y2) {
    const minX = Math.min(x1, x2), maxX = Math.max(x1, x2);
    for (let x = minX; x <= maxX; x++) {
      for (let y = y1 - halfWidth; y <= y1 + halfWidth; y++) {
        if (tileAt(x, y) && tileAt(x, y).base !== 'water' && tileAt(x, y).base !== 'cliff') setBase(x, y, 'path');
      }
    }
  }
}

function addDecor(type, x, y, extra={}){
  decorObjects.push({ type, x, y, ...extra });
}

function addWall(tx, ty, tw, th, kind){
  walls.push({ x: tx*TILE, y: ty*TILE, w: tw*TILE, h: th*TILE, kind });
}

function buildWorldObjects(){
  decorObjects.length = 0;
  walls.length = 0;
  outposts.length = 0;

  // Start farm.
  addWall(2, 29, 5, 3, 'house');
  addWall(7, 30, 3, 2, 'shed');
  addWall(2, 28, 12, 1, 'fenceH');
  addWall(2, 28, 1, 7, 'fenceV');
  addWall(2, 34, 9, 1, 'fenceH');
  addDecor('lantern', 5.2*TILE, 28.4*TILE);
  addDecor('sign', 12.7*TILE, 29.2*TILE);

  // Central farm around bridge.
  addWall(26, 22, 5, 3, 'house');
  addWall(31, 22, 5, 3, 'barn');
  addWall(25, 21, 13, 1, 'fenceH');
  addWall(25, 21, 1, 6, 'fenceV');
  addWall(25, 26, 11, 1, 'fenceH');
  addWall(37, 21, 1, 5, 'fenceV');
  addDecor('lantern', 30.5*TILE, 20.6*TILE);
  addDecor('sign', 36.5*TILE, 24.5*TILE);

  // North settlement.
  addWall(46, 4, 4, 3, 'house');
  addWall(51, 5, 4, 3, 'barn');
  addWall(45, 3, 1, 8, 'fenceV');
  addWall(45, 3, 11, 1, 'fenceH');
  addDecor('lantern', 49*TILE, 7.3*TILE);

  // Southeast camp.
  addWall(46, 31, 4, 3, 'house');
  addWall(51, 30, 5, 3, 'barn');

  // Decorative crates / blockers.
  addWall(19, 27, 2, 2, 'crate');
  addWall(16, 19, 3, 2, 'crate');
  addWall(39, 28, 3, 2, 'crate');

  // Trees clusters.
  const treeClusters = [
    [3,3,5,4], [18,3,4,3], [18,13,5,4], [42,17,4,4],
    [47,25,4,4], [42,32,3,4], [22,32,5,3], [4,13,3,5]
  ];
  treeClusters.forEach(([sx, sy, w, h], idx) => {
    for (let yy = 0; yy < h; yy++) {
      for (let xx = 0; xx < w; xx++) {
        addDecor('tree', (sx+xx+0.5)*TILE + rand(-7,7), (sy+yy+0.5)*TILE + rand(-7,7), { v: (idx+xx+yy)%3 });
      }
    }
  });

  // Scatter flowers, mushrooms, shrubs, stones.
  for (let i = 0; i < 220; i++) addDecor('shrub', ((i*91+37)%WORLD_W), ((i*167+53)%WORLD_H), { s: 1 + (i%3) });
  for (let i = 0; i < 70; i++) addDecor('flower', ((i*137+280)%WORLD_W), ((i*211+160)%WORLD_H), { c: i % 4 });
  for (let i = 0; i < 30; i++) addDecor('mushroom', ((i*269+95)%WORLD_W), ((i*181+121)%WORLD_H), { c: i % 3 });
  for (let i = 0; i < 18; i++) addDecor('stump', ((i*173+420)%WORLD_W), ((i*139+460)%WORLD_H));
  for (let i = 0; i < 26; i++) addDecor('stone', ((i*149+700)%WORLD_W), ((i*173+90)%WORLD_H));
  for (let i = 0; i < 14; i++) addDecor('crateDecor', ((i*219+530)%WORLD_W), ((i*157+260)%WORLD_H));

  // Signs / lanterns along path.
  [[7,27],[24,29],[36,17],[48,10],[53,30],[16,10],[33,32]].forEach(([tx,ty])=>addDecor('sign', tx*TILE+18, ty*TILE+20));
  [[28,28],[37,21],[50,12],[52,7]].forEach(([tx,ty])=>addDecor('lantern', tx*TILE+18, ty*TILE+20));

  // Outposts.
  [
    [5,36,1.4,4.8], [10,14,2.1,4.9], [29,24,2.6,4.5],
    [49,8,2.7,5.1], [49,23,1.8,4.7], [53,34,3.0,4.8]
  ].forEach(([tx,ty,timer,rate]) => {
    outposts.push({ x: tx*TILE + TILE/2, y: ty*TILE + TILE/2, timer, rate });
  });
}

function isWaterTile(tx, ty){
  const t = tileAt(tx, ty);
  return t && t.base === 'water' && t.overlay !== 'bridge';
}

function isPathTile(tx, ty){
  const t = tileAt(tx, ty);
  return t && t.base === 'path';
}

function isCliffTile(tx, ty){
  const t = tileAt(tx, ty);
  return t && t.base === 'cliff';
}

function resizeGame(){
  const portrait = innerHeight > innerWidth;
  W = portrait ? 270 : 480;
  H = portrait ? 480 : 270;
  canvas.width = W;
  canvas.height = H;
  leftStick.sx = 52; leftStick.sy = H - 48;
  rightStick.sx = W - 52; rightStick.sy = H - 48;
}
addEventListener('resize', resizeGame);

function worldToScreen(x, y){ return { x: x - camera.x, y: y - camera.y }; }
function screenToWorld(x, y){ return { x: x + camera.x, y: y + camera.y }; }
function visibleRect(x, y, w, h){ return x+w >= camera.x && x <= camera.x+W && y+h >= camera.y && y <= camera.y+H; }

function circleRectPush(obj, r){
  const nx = clamp(obj.x, r.x, r.x+r.w);
  const ny = clamp(obj.y, r.y, r.y+r.h);
  let dx = obj.x - nx, dy = obj.y - ny;
  let dd = dx*dx + dy*dy;
  if (dd < obj.r*obj.r) {
    if (dd === 0) {
      const dl = Math.abs(obj.x-r.x), dr = Math.abs(obj.x-(r.x+r.w));
      const dt = Math.abs(obj.y-r.y), db = Math.abs(obj.y-(r.y+r.h));
      const m = Math.min(dl,dr,dt,db);
      if (m === dl) obj.x = r.x - obj.r;
      else if (m === dr) obj.x = r.x + r.w + obj.r;
      else if (m === dt) obj.y = r.y - obj.r;
      else obj.y = r.y + r.h + obj.r;
      return true;
    }
    const d = Math.sqrt(dd), push = obj.r - d;
    obj.x += dx/d * push;
    obj.y += dy/d * push;
    return true;
  }
  return false;
}

function pointInWall(x, y){
  for (const r of walls) {
    if (x >= r.x && x <= r.x+r.w && y >= r.y && y <= r.y+r.h) return true;
  }
  return false;
}

function inWater(x, y){
  const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
  if (isWaterTile(tx, ty)) return true;
  return false;
}

function burst(x, y, type, count=7){
  for (let i=0;i<count;i++){
    const a = Math.random() * Math.PI * 2;
    const s = rand(20, 90);
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: rand(.12,.52), maxLife:.52, type });
  }
}
function explode(x, y){
  state.shake = Math.max(state.shake, 5);
  burst(x, y, 'spark', 12);
  burst(x, y, 'smoke', 8);
}
function spawnEnemyFrom(s){
  if (enemies.length >= 26) return;
  const a = Math.random() * Math.PI * 2, r = 20 + Math.random() * 18;
  enemies.push({
    x: clamp(s.x + Math.cos(a)*r, 12, WORLD_W-12),
    y: clamp(s.y + Math.sin(a)*r, 12, WORLD_H-12),
    r: 9, hp: 34, maxHp: 34,
    speed: 29 + rand(-2, 7),
    fireCooldown: rand(.2, 1.2),
    fireRate: .72 + rand(-.08, .16),
    angle: 0,
    hitFlash: 0
  });
  burst(s.x, s.y, 'spawn', 8);
}
function dropScrap(x, y){
  const n = 1 + (Math.random() < .35 ? 1 : 0);
  for (let i=0;i<n;i++){
    const a = Math.random() * Math.PI * 2, r = rand(3, 12);
    scraps.push({
      x: x + Math.cos(a)*r,
      y: y + Math.sin(a)*r,
      vx: Math.cos(a) * rand(10, 28),
      vy: Math.sin(a) * rand(10, 28)
    });
  }
}
function checkLevelUp(){
  if (state.xp >= state.xpNeed && !state.pausedForUpgrade) {
    state.xp -= state.xpNeed;
    state.level++;
    state.xpNeed = Math.round(state.xpNeed * 1.45 + 1);
    state.pausedForUpgrade = true;
  }
}
function chooseUpgrade(i){
  if (!state.pausedForUpgrade) return;
  upgradeChoices[i].apply();
  state.pausedForUpgrade = false;
}
function shootPlayer(){
  const a = player.turretAngle;
  bullets.push({
    x: player.x + Math.cos(a)*13,
    y: player.y + Math.sin(a)*13,
    vx: Math.cos(a)*player.bulletSpeed,
    vy: Math.sin(a)*player.bulletSpeed,
    life: 1.5
  });
  player.fireCooldown = 1 / player.fireRate;
  burst(player.x + Math.cos(a)*14, player.y + Math.sin(a)*14, 'muzzle', 3);
  state.shake = Math.max(state.shake, 1.2);
}
function shootEnemy(e){
  const a = Math.atan2(player.y-e.y, player.x-e.x);
  enemyBullets.push({
    x: e.x + Math.cos(a)*11,
    y: e.y + Math.sin(a)*11,
    vx: Math.cos(a)*108,
    vy: Math.sin(a)*108,
    life: 3
  });
  e.fireCooldown = 1 / e.fireRate;
}
function damagePlayer(v){
  if (state.gameOver) return;
  player.hp = Math.max(0, player.hp - v);
  state.shake = Math.max(state.shake, 4);
  if (player.hp <= 0) {
    state.gameOver = true;
    explode(player.x, player.y);
  }
}

function resetGame(){
  bullets.length = 0;
  enemyBullets.length = 0;
  enemies.length = 0;
  particles.length = 0;
  scraps.length = 0;

  state.score = 0;
  state.kills = 0;
  state.time = 0;
  state.shake = 0;
  state.gameOver = false;
  state.pausedForUpgrade = false;
  state.level = 1;
  state.xp = 0;
  state.xpNeed = 5;

  player.x = 7.6 * TILE;
  player.y = 31.5 * TILE;
  player.hp = 100;
  player.maxHp = 100;
  player.speed = 92;
  player.damage = 15;
  player.fireRate = 7.5;
  player.bulletSpeed = 240;
  player.fireCooldown = 0;

  for (let i=0;i<outposts.length;i++) outposts[i].timer = 1.4 + i*.55;
  updateCamera(true);
}

function updateCamera(snap=false){
  const tx = clamp(player.x - W/2, 0, WORLD_W - W);
  const ty = clamp(player.y - H/2, 0, WORLD_H - H);
  if (snap) { camera.x = tx; camera.y = ty; }
  else {
    camera.x += (tx - camera.x) * 0.14;
    camera.y += (ty - camera.y) * 0.14;
  }
}

function canvasPos(clientX, clientY){
  const r = canvas.getBoundingClientRect();
  return { x: (clientX-r.left)/r.width*W, y: (clientY-r.top)/r.height*H };
}

addEventListener('keydown', e => {
  keys.add(e.code);
  if (state.gameOver && (e.code === 'Enter' || e.code === 'Space')) resetGame();
  if (state.pausedForUpgrade) {
    if (e.code === 'Digit1') chooseUpgrade(0);
    if (e.code === 'Digit2') chooseUpgrade(1);
    if (e.code === 'Digit3') chooseUpgrade(2);
  }
});
addEventListener('keyup', e => keys.delete(e.code));

canvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') {
    const p = canvasPos(e.clientX, e.clientY);
    mouseX = p.x; mouseY = p.y;
  }
});

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  canvas.setPointerCapture?.(e.pointerId);
  const p = canvasPos(e.clientX, e.clientY);

  if (state.gameOver) { resetGame(); return; }

  if (state.pausedForUpgrade) {
    const cards = getUpgradeCards();
    for (let i=0;i<cards.length;i++) {
      const c = cards[i];
      if (p.x >= c.x && p.x <= c.x+c.w && p.y >= c.y && p.y <= c.y+c.h) {
        chooseUpgrade(i);
        return;
      }
    }
    return;
  }

  if (e.pointerType === 'mouse') {
    mouseDown = true;
    mouseX = p.x;
    mouseY = p.y;
    return;
  }

  if (p.x < W/2 && !leftStick.active) {
    leftStick.active = true; leftStick.id = e.pointerId;
    leftStick.sx = p.x; leftStick.sy = p.y;
    leftStick.dx = 0; leftStick.dy = 0;
  } else if (!rightStick.active) {
    rightStick.active = true; rightStick.id = e.pointerId;
    rightStick.sx = p.x; rightStick.sy = p.y;
    rightStick.dx = 0; rightStick.dy = 0;
  }
},{passive:false});

canvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') return;
  e.preventDefault();
  const p = canvasPos(e.clientX, e.clientY);
  function upd(s){
    let dx = p.x - s.sx, dy = p.y - s.sy;
    const len = Math.hypot(dx,dy), max = 28;
    if (len > max) { dx *= max/len; dy *= max/len; }
    s.dx = dx/max; s.dy = dy/max;
  }
  if (leftStick.active && e.pointerId === leftStick.id) upd(leftStick);
  if (rightStick.active && e.pointerId === rightStick.id) upd(rightStick);
},{passive:false});

function releasePointer(e){
  if (e.pointerType === 'mouse') { mouseDown = false; return; }
  if (leftStick.active && e.pointerId === leftStick.id) {
    leftStick.active = false; leftStick.id = null; leftStick.dx = 0; leftStick.dy = 0;
  }
  if (rightStick.active && e.pointerId === rightStick.id) {
    rightStick.active = false; rightStick.id = null; rightStick.dx = 0; rightStick.dy = 0;
  }
}
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

function update(dt){
  if (state.gameOver || state.pausedForUpgrade) {
    for (let i=particles.length-1;i>=0;i--) {
      const p = particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.life -= dt;
      p.vx *= .96; p.vy *= .96;
      if (p.life <= 0) particles.splice(i,1);
    }
    return;
  }

  state.time += dt;
  player.fireCooldown -= dt;

  for (const s of outposts) {
    s.timer -= dt;
    const near = d2(s.x,s.y,player.x,player.y) < 780*780;
    if (s.timer <= 0 && near) {
      spawnEnemyFrom(s);
      s.timer = s.rate * rand(.85,1.15);
    }
  }

  let mx=0,my=0;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) mx -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) mx += 1;
  if (keys.has('KeyW') || keys.has('ArrowUp')) my -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) my += 1;
  if (leftStick.active) { mx = leftStick.dx; my = leftStick.dy; }
  let ml = Math.hypot(mx,my);
  if (ml > 1) { mx /= ml; my /= ml; }

  let moveSpeed = player.speed * (inWater(player.x,player.y) ? .62 : 1);
  if (Math.abs(mx)+Math.abs(my) > .02) {
    player.x += mx * moveSpeed * dt;
    player.y += my * moveSpeed * dt;
    player.bodyAngle = Math.atan2(my,mx);
  }
  player.x = clamp(player.x,12,WORLD_W-12);
  player.y = clamp(player.y,12,WORLD_H-12);
  for (const r of walls) circleRectPush(player,r);

  let firing = mouseDown;
  if (rightStick.active) {
    const mag = Math.hypot(rightStick.dx,rightStick.dy);
    if (mag > .18) {
      player.turretAngle = Math.atan2(rightStick.dy,rightStick.dx);
      firing = true;
    }
  } else {
    const mw = screenToWorld(mouseX,mouseY);
    player.turretAngle = Math.atan2(mw.y-player.y, mw.x-player.x);
  }
  if (firing && player.fireCooldown <= 0) shootPlayer();

  for (let i=bullets.length-1;i>=0;i--) {
    const b = bullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if (pointInWall(b.x,b.y)) { burst(b.x,b.y,'spark',4); bullets.splice(i,1); continue; }
    let removed = false;
    for (let j=enemies.length-1;j>=0;j--) {
      const e = enemies[j];
      if (d2(b.x,b.y,e.x,e.y) < (e.r+2)*(e.r+2)) {
        e.hp -= player.damage;
        e.hitFlash = .07;
        burst(b.x,b.y,'spark',5);
        bullets.splice(i,1);
        removed = true;
        if (e.hp <= 0) {
          explode(e.x,e.y);
          dropScrap(e.x,e.y);
          enemies.splice(j,1);
          state.kills++;
          state.score += 100;
        }
        break;
      }
    }
    if (removed) continue;
    if (b.life <= 0 || b.x < 0 || b.x > WORLD_W || b.y < 0 || b.y > WORLD_H) bullets.splice(i,1);
  }

  for (let i=0;i<enemies.length;i++) {
    const e = enemies[i];
    e.fireCooldown -= dt;
    e.hitFlash -= dt;
    const a = Math.atan2(player.y-e.y, player.x-e.x);
    const d = Math.hypot(player.x-e.x, player.y-e.y);
    let vx=0,vy=0;
    if (d > 82) { vx = Math.cos(a)*e.speed; vy = Math.sin(a)*e.speed; }
    else if (d < 58) { vx = -Math.cos(a)*e.speed*.5; vy = -Math.sin(a)*e.speed*.5; }

    for (let j=0;j<enemies.length;j++) {
      if (i===j) continue;
      const o=enemies[j], dx=e.x-o.x, dy=e.y-o.y, dd=dx*dx+dy*dy;
      if (dd>0 && dd<24*24) {
        const q=Math.sqrt(dd);
        vx += (dx/q)*18;
        vy += (dy/q)*18;
      }
    }

    e.x += vx*dt; e.y += vy*dt; e.angle = a;
    e.x = clamp(e.x,10,WORLD_W-10); e.y = clamp(e.y,10,WORLD_H-10);
    for (const r of walls) circleRectPush(e,r);

    if (d < 145 && e.fireCooldown <= 0) shootEnemy(e);
    if (d < player.r+e.r+2) damagePlayer(18*dt);
  }

  for (let i=enemyBullets.length-1;i>=0;i--) {
    const b = enemyBullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if (pointInWall(b.x,b.y)) { enemyBullets.splice(i,1); continue; }
    if (d2(b.x,b.y,player.x,player.y) < (player.r+2)*(player.r+2)) {
      damagePlayer(10);
      enemyBullets.splice(i,1);
      continue;
    }
    if (b.life<=0 || b.x<0 || b.x>WORLD_W || b.y<0 || b.y>WORLD_H) enemyBullets.splice(i,1);
  }

  for (let i=scraps.length-1;i>=0;i--) {
    const s=scraps[i];
    s.x+=s.vx*dt; s.y+=s.vy*dt;
    s.vx*=Math.pow(.05,dt); s.vy*=Math.pow(.05,dt);
    const dd=Math.sqrt(d2(s.x,s.y,player.x,player.y));
    if (dd<48) {
      const a=Math.atan2(player.y-s.y,player.x-s.x), pull=(48-dd)*4;
      s.x+=Math.cos(a)*pull*dt; s.y+=Math.sin(a)*pull*dt;
    }
    if (dd<12) {
      state.xp++;
      state.score += 25;
      scraps.splice(i,1);
      checkLevelUp();
    }
  }

  for (let i=particles.length-1;i>=0;i--) {
    const p=particles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.life-=dt;
    p.vx*=Math.pow(.03,dt); p.vy*=Math.pow(.03,dt);
    if (p.life<=0) particles.splice(i,1);
  }

  state.shake = Math.max(0, state.shake - dt*15);
  updateCamera(false);
}

function px(x,y,w,h,c){
  ctx.fillStyle = c;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

function drawTile(tx, ty){
  const tile = tileAt(tx, ty);
  if (!tile) return;
  const sx = tx*TILE - camera.x;
  const sy = ty*TILE - camera.y;

  if (tile.base === 'grass') {
    const grassCols = ['#29502d', '#315836', '#2a4e2f'];
    px(sx,sy,TILE,TILE,grassCols[tile.variant%grassCols.length]);
    px(sx,sy,TILE,3,'rgba(255,255,255,0.03)');
    px(sx+4,sy+6,4,2,'#47754a');
    px(sx+20,sy+22,3,2,'#3f6c43');
    if (tile.variant === 1) px(sx+10,sy+14,5,3,'#3d6a40');
    if (tile.variant === 2) px(sx+23,sy+8,4,2,'#4a7b51');
  }
  else if (tile.base === 'field') {
    px(sx,sy,TILE,TILE,'#697232');
    for (let yy = 5; yy < TILE; yy += 8) px(sx, sy+yy, TILE, 2, '#8e9244');
    px(sx, sy+2, TILE, 2, '#59612a');
  }
  else if (tile.base === 'path') {
    px(sx,sy,TILE,TILE,'#b38e58');
    px(sx,sy,TILE,4,'#d6b47e');
    px(sx,sy+TILE-4,TILE,4,'#876844');
    px(sx+3,sy+7,5,3,'#a37d47');
    px(sx+20,sy+18,4,2,'#c9ab75');
  }
  else if (tile.base === 'water') {
    px(sx,sy,TILE,TILE,'#2e8dbe');
    px(sx,sy,TILE,4,'#73d4ff');
    px(sx,sy+TILE-4,TILE,4,'#1e628a');
    px(sx+4,sy+7,10,2,'rgba(255,255,255,0.20)');
    px(sx+18,sy+18,8,2,'rgba(255,255,255,0.14)');
  }
  else if (tile.base === 'cliff') {
    px(sx,sy,TILE,TILE,'#6b6258');
    px(sx,sy,TILE,8,'#7fd15e');
    px(sx,sy+8,TILE,TILE-8,'#645b50');
    px(sx+6,sy+15,4,11,'#776e62');
    px(sx+20,sy+12,4,15,'#71675c');
  }

  // Water edges
  if (tile.base !== 'water') {
    if (isWaterTile(tx, ty-1)) px(sx, sy, TILE, 4, '#bff4ff');
    if (isWaterTile(tx, ty+1)) px(sx, sy+TILE-4, TILE, 4, '#bff4ff');
    if (isWaterTile(tx-1, ty)) px(sx, sy, 4, TILE, '#bff4ff');
    if (isWaterTile(tx+1, ty)) px(sx+TILE-4, sy, 4, TILE, '#bff4ff');
  }

  // Cliff top transition when neighbor is not cliff
  if (tile.base !== 'cliff') {
    if (isCliffTile(tx, ty-1)) px(sx, sy, TILE, 6, '#4f493f');
    if (isCliffTile(tx-1, ty)) px(sx, sy, 6, TILE, '#534c42');
  }

  // Bridge overlay
  if (tile.overlay === 'bridge') {
    px(sx,sy,TILE,TILE,'#7c5630');
    for (let x = 0; x < TILE; x += 8) px(sx+x,sy,3,TILE,'#a27445');
    px(sx,sy+4,TILE,3,'#5e3d1f');
    px(sx,sy+TILE-7,TILE,3,'#5e3d1f');
  }
}

function drawTree(obj){
  const sx = obj.x - camera.x, sy = obj.y - camera.y;
  px(sx-3,sy+5,6,12,'#5d3c22');
  const leaf = obj.v===0 ? '#3d8a4c' : obj.v===1 ? '#2d7240' : '#4a9a57';
  px(sx-13,sy-10,26,20,leaf);
  px(sx-9,sy-16,18,10,'#7fd773');
  px(sx-15,sy-2,8,8,'#4fa85b');
}
function drawFlower(obj){
  const sx = obj.x - camera.x, sy = obj.y - camera.y;
  const colors = ['#ffb34d','#ff72b1','#9fe7ff','#ffe97e'];
  px(sx,sy,2,4,'#579349');
  px(sx-1,sy-2,4,4,colors[obj.c]);
}
function drawMushroom(obj){

}
function drawShrub(obj){

  px(sx+1,sy-2,obj.s+1,obj.s,'#4f9148');
}
function drawStump(obj){

}
function drawStone(obj){

}
function drawLantern(obj){

  px(sx-2,sy,4,20,'#6d4f2e');
  px(sx-6,sy-8,12,8,'#f5cf69');

}
function drawSign(obj){

  px(sx-2,sy-2,4,18,'#7a562f');
  px(sx-10,sy-10,20,8,'#9c703d');
}
function drawCrateDecor(obj){
  const sx=obj.x-camera.x, sy=obj.y-camera.y;
  px(sx-6,sy-6,12,12,'#8b6036');
  px(sx-4,sy-4,8,8,'#aa7d49');

function drawStructure(r){
  const sx = r.x - camera.x, sy = r.y - camera.y;

  if (r.kind === 'fenceH' || r.kind === 'fenceV') {
    px(sx,sy,r.w,r.h,'#6f5637');
    if (r.w > r.h) {
      for (let x=0;x<r.w;x+=22) px(sx+x,sy-4,4,r.h+8,'#a6814f');
    } else {
      for (let y=0;y<r.h;y+=22) px(sx-4,sy+y,r.w+8,4,'#a6814f');
    }
    return;
  }

  if (r.kind === 'house') {
    px(sx,sy,r.w,r.h,'#4e3b2d');
    px(sx+6,sy+8,r.w-12,r.h-14,'#71563f');
    px(sx+10,sy+14,r.w-20,r.h-28,'#82654c');
    px(sx,sy,r.w,13,'#2d6574');
    px(sx+10,sy+22,18,15,'#ffcf7a');
    px(sx+r.w-28,sy+22,18,15,'#ffcf7a');
    px(sx+r.w/2-10,sy+r.h-28,20,28,'#5b412d');
  }
  else if (r.kind === 'barn') {
    px(sx,sy,r.w,r.h,'#4c2c26');
    px(sx+6,sy+10,r.w-12,r.h-16,'#7f4538');
    px(sx+12,sy+16,r.w-24,r.h-30,'#a05e4a');
    px(sx,sy,r.w,12,'#22475f');
    px(sx+r.w/2-14,sy+r.h-32,28,32,'#5d3c30');
    px(sx+r.w/2-10,sy+r.h-28,20,28,'#7d5541');
  }
  else if (r.kind === 'shed') {
    px(sx,sy,r.w,r.h,'#4e473d');
    px(sx+6,sy+8,r.w-12,r.h-14,'#7d6f5a');
    px(sx,sy,r.w,10,'#665b4f');
    px(sx+r.w/2-8,sy+r.h-22,16,22,'#594939');
  }
  else if (r.kind === 'crate') {
    px(sx,sy,r.w,r.h,'#5e4b36');
    px(sx+4,sy+4,r.w-8,r.h-8,'#83684b');
    for (let y=10;y<r.h-8;y+=16) {
      for (let x=10;x<r.w-8;x+=16) px(sx+x,sy+y,8,8,'#6b553e');
    }
  }
}

function drawOutpost(o){
  const p = worldToScreen(o.x,o.y);
  const pulse = 2 + Math.sin(state.time*4 + o.x*0.01) * 2;
  ctx.strokeStyle = '#942c35';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(Math.round(p.x), Math.round(p.y), 15+pulse, 0, Math.PI*2);
  ctx.stroke();
  px(p.x-12,p.y-12,24,24,'#3c2730');
  px(p.x-10,p.y-10,20,20,'#692a34');
  px(p.x-5,p.y-16,10,32,'#ce4a5b');
  px(p.x-12,p.y-3,24,6,'#ef7e72');
}

function drawRobotWorld(x,y,bodyA,turretA,enemy=false,flash=false){
  const sx = x - camera.x, sy = y - camera.y;
  ctx.save();
  ctx.translate(Math.round(sx), Math.round(sy));
  ctx.rotate(bodyA);
  const dark = enemy ? '#31161b' : '#234558';
  const mid = flash ? '#f2f5f6' : (enemy ? '#b14a49' : '#6aa9d2');
  const light = enemy ? '#dd7162' : '#9be0ff';
  px(-10,-7,4,14,dark);
  px(6,-7,4,14,dark);
  px(-8,-8,16,16,mid);
  px(-5,-5,10,10,light);
  px(-7,-10,4,3,'#11161a');
  px(3,-10,4,3,'#11161a');
  px(-7,7,4,3,'#11161a');
  px(3,7,4,3,'#11161a');
  ctx.restore();

  ctx.save();
  ctx.translate(Math.round(sx), Math.round(sy));
  ctx.rotate(turretA);
  px(-5,-5,10,10,enemy ? '#c15a57' : '#7bc6e8');
  px(2,-2,11,4,enemy ? '#f38a79' : '#d9f7ff');
  px(12,-1,4,2,'#ffffff');
  ctx.restore();
}

function drawWorld(){
  const minTX = Math.max(0, Math.floor(camera.x / TILE) - 1);
  const minTY = Math.max(0, Math.floor(camera.y / TILE) - 1);
  const maxTX = Math.min(MAP_W-1, Math.ceil((camera.x + W) / TILE) + 1);
  const maxTY = Math.min(MAP_H-1, Math.ceil((camera.y + H) / TILE) + 1);

  for (let ty = minTY; ty <= maxTY; ty++) {
    for (let tx = minTX; tx <= maxTX; tx++) drawTile(tx, ty);
  }

  // Ground decor below structures.
  for (const obj of decorObjects) {
    if (obj.x < camera.x-20 || obj.x > camera.x+W+20 || obj.y < camera.y-24 || obj.y > camera.y+H+24) continue;
    if (obj.type === 'shrub') drawShrub(obj);
    else if (obj.type === 'flower') drawFlower(obj);
    else if (obj.type === 'mushroom') drawMushroom(obj);
    else if (obj.type === 'stump') drawStump(obj);
    else if (obj.type === 'stone') drawStone(obj);
    else if (obj.type === 'crateDecor') drawCrateDecor(obj);
  }

  // Trees
  for (const obj of decorObjects) {
    if (obj.type !== 'tree') continue;
    if (obj.x < camera.x-24 || obj.x > camera.x+W+24 || obj.y < camera.y-32 || obj.y > camera.y+H+24) continue;
    drawTree(obj);
  }

  // Structures
  for (const r of walls) if (visibleRect(r.x,r.y,r.w,r.h)) drawStructure(r);

  // Path props
  for (const obj of decorObjects) {
    if (obj.type === 'sign' && obj.x >= camera.x-20 && obj.x <= camera.x+W+20 && obj.y >= camera.y-24 && obj.y <= camera.y+H+24) drawSign(obj);
    if (obj.type === 'lantern' && obj.x >= camera.x-20 && obj.x <= camera.x+W+20 && obj.y >= camera.y-24 && obj.y <= camera.y+H+24) drawLantern(obj);
  }

  // Outposts
  for (const o of outposts) {
    if (o.x >= camera.x-30 && o.x <= camera.x+W+30 && o.y >= camera.y-30 && o.y <= camera.y+H+30) drawOutpost(o);
  }

  // Scraps
  for (const s of scraps) {
    const p = worldToScreen(s.x,s.y);
    px(p.x-4,p.y-3,8,6,'#d7b35b');
    px(p.x-5,p.y-6,10,3,'#f6dc7e');
    px(p.x-4,p.y+1,8,2,'#9c7c3a');
  }

  // Bullets
  for (const b of bullets) {
    const p = worldToScreen(b.x,b.y);
    px(p.x-2,p.y-1,5,2,'#d8f4ff');
  }
  for (const b of enemyBullets) {
    const p = worldToScreen(b.x,b.y);
    px(p.x-2,p.y-2,4,4,'#ff8c69');
  }

  // Enemies
  for (const e of enemies) {
    if (e.x < camera.x-20 || e.x > camera.x+W+20 || e.y < camera.y-20 || e.y > camera.y+H+20) continue;
    drawRobotWorld(e.x,e.y,e.angle,e.angle,true,e.hitFlash>0);
    const p = worldToScreen(e.x,e.y);
    px(p.x-10,p.y-15,20,3,'#190d0e');
    px(p.x-10,p.y-15,20*(e.hp/e.maxHp),3,'#c84f54');
  }

  if (!state.gameOver) drawRobotWorld(player.x,player.y,player.bodyAngle,player.turretAngle,false,false);

  // Particles
  for (const p of particles) {
    const s = worldToScreen(p.x,p.y);
    if (s.x<-10 || s.x>W+10 || s.y<-10 || s.y>H+10) continue;
    const a = clamp(p.life/p.maxLife,0,1);
    ctx.globalAlpha = a;
    if (p.type === 'smoke') px(s.x-2,s.y-2,5,5,'#596470');
    else if (p.type === 'spawn') px(s.x-2,s.y-2,4,4,'#e74d62');
    else if (p.type === 'muzzle') px(s.x-2,s.y-1,4,2,'#fff0a7');
    else px(s.x,s.y,2,2,'#ffd16a');
  }
  ctx.globalAlpha = 1;
}

function drawHUD(){
  px(7,7,104,12,'#06080b');
  px(9,9,100,8,'#242b31');
  px(9,9,100*(player.hp/player.maxHp),8,player.hp>35?'#58a968':'#ba5151');

  ctx.fillStyle='#f0f2f2';
  ctx.font='10px monospace';
  ctx.fillText(`HP ${Math.ceil(player.hp)}/${player.maxHp}`,11,18);
  ctx.fillText(`УР. ${state.level}`,7,33);
  ctx.fillText(`УНИЧТОЖЕНО: ${state.kills}`,7,46);

  const barW=Math.min(125,W-14);
  px(7,54,barW,7,'#111519');
  px(8,55,(barW-2)*(state.xp/state.xpNeed),5,'#d7b15e');
  ctx.fillStyle='#e0d1a1';
  ctx.fillText(`ДЕТАЛИ ${state.xp}/${state.xpNeed}`,7,72);

  ctx.fillStyle='#d9e0d3';
  ctx.fillText('v0.6',W-31,14);
}

function drawMiniMap(){
  const mw=64, mh=44, x=W-mw-7, y=24;
  ctx.globalAlpha=.85;
  px(x,y,mw,mh,'#17261a');
  ctx.strokeStyle='#d5dbc9';
  ctx.lineWidth=1;
  ctx.strokeRect(x+.5,y+.5,mw-1,mh-1);

  // Show river roughly.
  for (let ty=0; ty<MAP_H; ty++) {
    for (let tx=0; tx<MAP_W; tx++) {
      const t = tileAt(tx,ty);
      if (!t) continue;
      if (t.base === 'water') {
        px(x + tx/MAP_W*mw, y + ty/MAP_H*mh, Math.max(2,mw/MAP_W), Math.max(2,mh/MAP_H), '#3497c9');
      }
    }
  }

  for (const o of outposts) px(x+(o.x/WORLD_W)*mw-1, y+(o.y/WORLD_H)*mh-1, 3, 3, '#d25454');
  px(x+(player.x/WORLD_W)*mw-1, y+(player.y/WORLD_H)*mh-1, 3, 3, '#8fd9ef');
  ctx.globalAlpha=1;
}

function drawStick(s, dx, dy, label){
  const bx=s.active?s.sx:dx, by=s.active?s.sy:dy;
  const kx=bx+s.dx*28, ky=by+s.dy*28;
  ctx.globalAlpha=.28;
  ctx.strokeStyle='#eef0ea';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(bx,by,28,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(kx,ky,11,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='#eef0ea';
  ctx.font='8px monospace';
  ctx.textAlign='center';
  ctx.fillText(label,bx,by+42);
  ctx.textAlign='left';
  ctx.globalAlpha=1;
}
function drawTouchControls(){
  if (navigator.maxTouchPoints <= 0) return;
  drawStick(leftStick,52,H-48,'ДВИЖЕНИЕ');
  drawStick(rightStick,W-52,H-48,'ОГОНЬ');
}

function getUpgradeCards(){
  const gap=7;
  if (H>W) {
    const w=W-28,h=74,x=14;
    return [
      {x,y:H/2-120,w,h},
      {x,y:H/2-39,w,h},
      {x,y:H/2+42,w,h}
    ];
  }
  const w=138,h=92,total=w*3+gap*2,sx=(W-total)/2;
  return [
    {x:sx,y:H/2-46,w,h},
    {x:sx+w+gap,y:H/2-46,w,h},
    {x:sx+(w+gap)*2,y:H/2-46,w,h}
  ];
}
function drawUpgrade(){
  ctx.fillStyle='rgba(4,6,5,.88)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#f4f6f2';
  ctx.font='bold 15px monospace';
  ctx.textAlign='center';
  ctx.fillText(`УРОВЕНЬ ${state.level}`,W/2,H>W?H/2-153:48);
  ctx.font='10px monospace';
  ctx.fillStyle='#aab4a8';
  ctx.fillText('ВЫБЕРИ УЛУЧШЕНИЕ',W/2,H>W?H/2-136:63);

  const cards=getUpgradeCards();
  cards.forEach((c,i)=>{
    px(c.x,c.y,c.w,c.h,'#1b2520');
    px(c.x,c.y,c.w,3,'#819082');
    px(c.x+5,c.y+5,19,19,'#304139');
    ctx.fillStyle='#eef1eb';
    ctx.font='bold 9px monospace';
    ctx.textAlign='left';
    ctx.fillText(`${i+1}. ${upgradeChoices[i].name}`,c.x+9,c.y+34);
    ctx.fillStyle='#d2ba6c';
    ctx.font='9px monospace';
    ctx.fillText(upgradeChoices[i].desc,c.x+9,c.y+51);
  });
  ctx.textAlign='left';
}

function render(){
  ctx.save();
  let ox=0, oy=0;
  if (state.shake>0) { ox=rand(-state.shake,state.shake); oy=rand(-state.shake,state.shake); }
  ctx.translate(Math.round(ox),Math.round(oy));
  drawWorld();
  ctx.restore();

  drawHUD();
  drawMiniMap();
  drawTouchControls();

  if (state.pausedForUpgrade) drawUpgrade();

  if (state.gameOver) {
    ctx.fillStyle='rgba(0,0,0,.78)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f4f5f3';
    ctx.font='bold 19px monospace';
    ctx.textAlign='center';
    ctx.fillText('РОБОТ УНИЧТОЖЕН',W/2,H/2-25);
    ctx.font='10px monospace';
    ctx.fillStyle='#bec7bd';
    ctx.fillText(`Счёт ${state.score}   Врагов ${state.kills}   Уровень ${state.level}`,W/2,H/2);
    ctx.fillText('Коснись экрана для новой игры',W/2,H/2+22);
    ctx.textAlign='left';
  }
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);
  last=now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

resizeGame();
initTerrain();
buildWorldObjects();
resetGame();
requestAnimationFrame(loop);
})();
</script>
</body>
